<!DOCTYPE html>
<html lang="en" data-theme="white">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>NSXL</title>
<script>
/* Apply the saved theme before first paint so there is no flash. */
(function () {
  try {
    var c = JSON.parse(localStorage.getItem('ch.cfg') || '{}');
    var t = c.theme || 'white';
    if (t === 'video' && window.Android && !Android.hasVideo()) t = 'black';
    document.documentElement.setAttribute('data-theme', t);
    if (c.scale) document.documentElement.style.setProperty('--scale', c.scale);
  } catch (e) {}
})();
</script>
<style>
@property --a { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
@font-face { font-family: "Montserrat"; src: url("fonts/Montserrat.ttf") format("truetype"); font-weight: 100 900; font-style: normal; font-display: swap; }

:root {
  --scale: 1;
  --u: calc(min(1vw, 1.7778vh) * var(--scale));   /* 1% of a 16:9 stage, times the Interface size setting */
  --H: calc(var(--u) * 56.25);
  --oy: calc((100vh - var(--H)) / 2);    /* vertical offset of the stage */
  --tile: calc(var(--u) * 20);
  --gap: calc(var(--u) * 1.25);
  --side: calc(var(--u) * 8.3);
  --r: calc(var(--u) * 1);
  --font: "Montserrat", "Roboto", "Noto Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --ring: conic-gradient(from var(--a), #3ec5ff 0deg, #4d7dff 70deg, #9b7bff 130deg, #4d7dff 190deg, #3ec5ff 250deg, #c9f4ff 292deg, #ffffff 310deg, #b5efff 328deg, #3ec5ff 360deg);
  --glow: rgba(110, 140, 255, .32);
}
html[data-theme=white] {
  --bg:#ebebeb; --ovBg:#ebebeb; --fg:#232323; --fg2:#5e5e5e; --accent:#1f5fd6;
  --slot:#f7f7f7; --pill:#f6f6f6; --pillLine:transparent; --selBg:#ffffff; --gapRing:#ffffff;
  --panel:#fbfbfb; --line:#dadada; --grey:#7f7f7f; --shadow:rgba(0,0,0,.12); --btn:#3a3a3a; --btnFg:#fff;
  --c-orange:#e8902a; --c-green:#3f9f45; --c-red:#de3434; --c-blue:#3a76cf; --c-teal:#2aa3b1;
}
html[data-theme=black] {
  --bg:#000000; --ovBg:#000000; --fg:#f0f0f0; --fg2:#a6a6a6; --accent:#3fcfff;
  --slot:#151515; --pill:#121212; --pillLine:#1f1f1f; --selBg:#262626; --gapRing:#000;
  --panel:#1b1b1b; --line:#2c2c2c; --grey:#a0a0a0; --shadow:rgba(0,0,0,.7); --btn:#e8e8e8; --btnFg:#000;
  --c-orange:#f3a03c; --c-green:#55c25b; --c-red:#ff5757; --c-blue:#5b9bff; --c-teal:#39c6d3;
}
html[data-theme=video] {
  --bg:transparent; --ovBg:rgba(8,8,12,.86); --fg:#ffffff; --fg2:rgba(255,255,255,.8); --accent:#86e3ff;
  --slot:rgba(255,255,255,.13); --pill:rgba(12,12,18,.45); --pillLine:rgba(255,255,255,.12);
  --selBg:rgba(255,255,255,.22); --gapRing:rgba(255,255,255,.92);
  --panel:rgba(30,30,36,.97); --line:rgba(255,255,255,.15); --grey:#e4e4e4; --shadow:rgba(0,0,0,.45);
  --btn:#fff; --btnFg:#000;
  --c-orange:#ffb257; --c-green:#72d978; --c-red:#ff6b6b; --c-blue:#86b5ff; --c-teal:#62dde8;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; height: 100%; overflow: hidden;
  background: var(--bg); color: var(--fg); font-family: var(--font);
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
}
body { opacity: 0; transition: opacity .25s; }
body.ready { opacity: 1; }
svg { display: block; }
.ic { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- live wallpaper helpers ---------- */
#fakeVideo {   /* only used in the browser preview, the app plays your real video behind the page */
  position: fixed; inset: 0; display: none;
  background:
    radial-gradient(circle at 20% 30%, #ff5f6d 0, transparent 38%),
    radial-gradient(circle at 80% 25%, #4facfe 0, transparent 42%),
    radial-gradient(circle at 55% 85%, #a18cd1 0, transparent 42%),
    linear-gradient(135deg, #1e1b4b, #0b1020);
  background-size: 200% 200%;
  animation: fv 16s ease-in-out infinite alternate;
}
@keyframes fv { from { background-position: 0% 0%; } to { background-position: 100% 100%; } }
#dim { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; }
html[data-theme=video] #dim { opacity: var(--dim, .25); }
html[data-theme=video] #top, html[data-theme=video] #foot,
html[data-theme=video] #gameTitle, html[data-theme=video] #dockLabel { text-shadow: 0 1px 4px rgba(0,0,0,.55); }

/* ---------- header ---------- */
#top {
  position: fixed; z-index: 30; left: 0; right: 0;
  top: calc(var(--u) * 3.6); height: calc(var(--u) * 5);
  padding: 0 max(calc(var(--u) * 4), env(safe-area-inset-right)) 0 max(calc(var(--u) * 4), env(safe-area-inset-left));
  display: flex; align-items: center; justify-content: space-between; pointer-events: none;
}
#top > * { pointer-events: auto; }
#avatar {
  width: calc(var(--u) * 4.4); height: calc(var(--u) * 4.4); border-radius: 50%;
  background: var(--selBg); position: relative; cursor: pointer; isolation: isolate; --rr: 50%;
  box-shadow: 0 0 0 calc(var(--u) * .28) var(--gapRing), 0 calc(var(--u) * .3) calc(var(--u) * .9) var(--shadow);
  transition: opacity .2s;
}
#avatarDefault { position: absolute; inset: 0; display: grid; place-items: center; color: var(--grey); }
#avatarDefault svg { width: 66%; height: 66%; }
#avatarImg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; border-radius: 50%; }
#avatar.sel::after, #avatar.sel > .ring { border-radius: 50%; inset: calc(var(--u) * -.45); }
#avatarName { position: absolute; left: calc(var(--u) * -.4); top: calc(100% + var(--u) * 1.1); white-space: nowrap; font-size: calc(var(--u) * 1.55); font-weight: 600; color: var(--accent);
  opacity: 0; transform: translateY(calc(var(--u) * -.4)); transition: opacity .2s, transform .25s cubic-bezier(.2,.8,.2,1); pointer-events: none; }
#avatar.sel #avatarName { opacity: 1; transform: none; }
#avatarImg.ok { display: block; }
body.full #avatar { opacity: 0; pointer-events: none; }
body.full #home { visibility: hidden; }
#status { display: flex; align-items: center; gap: calc(var(--u) * 1.4); color: var(--fg); }
#clock { font-size: calc(var(--u) * 2.75); font-weight: 500; letter-spacing: .02em; display: flex; align-items: baseline; }
#ampm { font-size: calc(var(--u) * 1.3); font-weight: 600; margin-left: calc(var(--u) * .3); }
#net svg { width: calc(var(--u) * 2.5); height: calc(var(--u) * 2.5); }
#bat svg { width: calc(var(--u) * 3.6); height: calc(var(--u) * 1.8); }
#bat .lvl { fill: var(--fg); }
#bat.low .lvl { fill: #ff4b4b; }
#bat.chg { color: #2fbf4f; }
#bat.chg .lvl { fill: #2fbf4f; }
#bat .bolt { fill: #fff; }
#batPct { font-size: calc(var(--u) * 2.2); font-weight: 500; margin-right: calc(var(--u) * -.5); }
#batPct:empty { display: none; }

/* ---------- home: tile row ---------- */
#home { position: fixed; inset: 0; }
#home.enter { animation: enter .32s cubic-bezier(.2,.8,.2,1); }
@keyframes enter { from { opacity: 0; transform: scale(1.025); } to { opacity: 1; transform: none; } }
#gameTitle {
  position: absolute; left: 0; top: calc(var(--oy) + var(--u) * 11.9);
  display: flex; align-items: center; gap: calc(var(--u) * .7);
  font-size: calc(var(--u) * 1.85); font-weight: 500; color: var(--accent); line-height: 1.3;
  white-space: nowrap; opacity: 0; transition: opacity .12s; pointer-events: none;
}
#gameTitle .tIcon { flex: 0 0 auto; width: calc(var(--u) * 1.25); height: calc(var(--u) * 1.6); border-radius: calc(var(--u) * .22); background: var(--accent); position: relative; }
#gameTitle .tIcon::after { content: ''; position: absolute; left: 22%; right: 22%; bottom: 14%; height: 12%; border-radius: 2px; background: rgba(255,255,255,.75); }
#gameTitle .tClip { flex: 1; min-width: 0; overflow: hidden; }
#gameTitle span { display: inline-block; white-space: nowrap; }
#gameTitle.marquee .tClip { -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 3%, #000 93%, transparent 100%); mask-image: linear-gradient(90deg, transparent 0, #000 3%, #000 93%, transparent 100%); }
#gameTitle.marquee span { animation: marquee var(--dur, 6s) ease-in-out infinite alternate; }
@keyframes marquee { 0%, 18% { transform: translateX(0); } 82%, 100% { transform: translateX(var(--shift, 0px)); } }
#rowWrap {
  position: absolute; left: 0; right: 0; top: calc(var(--oy) + var(--u) * 13.5);
  height: calc(var(--tile) + var(--u) * 4);
  overflow-x: auto; overflow-y: hidden; scrollbar-width: none; -webkit-overflow-scrolling: touch;
}
#rowWrap::-webkit-scrollbar { display: none; }
#row { display: flex; gap: var(--gap); padding: calc(var(--u) * 2) var(--side); width: max-content; }
.tile {
  position: relative; flex: 0 0 var(--tile); width: var(--tile); height: var(--tile);
  border-radius: var(--r); background: var(--slot); isolation: isolate; cursor: pointer;
}
.tile img, .cell .art img, .clip video.artVid {
  position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
  border-radius: inherit; display: block; pointer-events: none;
}
.fb { position: absolute; inset: 0; border-radius: inherit; display: grid; place-items: center;
      color: #fff; font-weight: 700; font-size: calc(var(--u) * 6); }
.cell .fb { font-size: calc(var(--u) * 4); }
.tile.slot { cursor: default; }
.tile.more {
  --rr: 50%; flex: 0 0 calc(var(--u) * 7.4); width: calc(var(--u) * 7.4); height: calc(var(--u) * 7.4);
  align-self: center; margin-left: calc(var(--u) * 1.2); border-radius: 50%;
  display: grid; place-items: center; color: var(--grey); background: var(--slot);
  box-shadow: 0 calc(var(--u) * .2) calc(var(--u) * .8) var(--shadow);
}
.tile.more svg { width: calc(var(--u) * 3.2); height: calc(var(--u) * 3.2); }
.tile.more.sel { box-shadow: 0 0 0 calc(var(--u) * .2) var(--gapRing); }
.tile.sel, .dk.sel, .cell .art.sel, .tprev.sel { animation: selPop .3s cubic-bezier(.3,1.7,.5,1); }
@keyframes selPop { 0% { transform: scale(.975); } 100% { transform: scale(1); } }
.tile.pop { animation: pop .28s ease; }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(.95); } 100% { transform: scale(1); } }
.nudgeL { animation: nudgeL .22s ease; } .nudgeR { animation: nudgeR .22s ease; }
@keyframes nudgeL { 50% { transform: translateX(calc(var(--u) * -.7)); } }
@keyframes nudgeR { 50% { transform: translateX(calc(var(--u) * .7)); } }

/* ---------- Switch-style motion ---------- */
body.intro #top { animation: fadeDown .55s cubic-bezier(.2,.8,.2,1) both; }
body.intro #row .tile { animation: tileIn .6s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i, 0) * 55ms + 90ms); }
body.intro #dock { animation: rise .6s cubic-bezier(.2,.8,.2,1) .28s both; }
body.intro #foot { animation: fadeUp .5s .4s both; }
@keyframes tileIn { from { opacity: 0; transform: translateX(calc(var(--u) * 7)) scale(.94); } to { opacity: 1; transform: none; } }
@keyframes rise { from { opacity: 0; transform: translateY(calc(var(--u) * 3)) scale(.97); } to { opacity: 1; transform: none; } }
@keyframes fadeDown { from { opacity: 0; transform: translateY(calc(var(--u) * -1.5)); } to { opacity: 1; transform: none; } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(calc(var(--u) * 1.5)); } to { opacity: 1; transform: none; } }
/* launch: the home screen eases back while the chosen tile lifts, then Android grows the app out of it */
body.leaving #top, body.leaving #foot, body.leaving #dock { animation: fadeOut .22s ease-out both; }
body.leaving .tile:not(.launching), body.leaving #home > :not(#rowWrap), body.leaving .ov { animation: recede .3s cubic-bezier(.2,.7,.3,1) both; }
body.leaving .ring b, body.leaving #bgfx i, body.leaving .tile .title { animation-play-state: paused !important; }
@keyframes recede { to { opacity: .25; transform: scale(.97); } }
@keyframes leave { to { opacity: 0; transform: scale(1.07); } }
@keyframes fadeOut { to { opacity: 0; } }
.tile.launching, .art.launching { z-index: 3; animation: launchTile .3s cubic-bezier(.2,.7,.3,1) both; will-change: transform; }
@keyframes launchTile { 0% { transform: scale(1); } 30% { transform: scale(.965); } 100% { transform: scale(1.04); } }
.ov.full.show .cell { animation: cellIn .42s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(min(var(--i, 0), 20) * 16ms); }
@keyframes cellIn { from { opacity: 0; transform: translateY(calc(var(--u) * 2)) scale(.96); } to { opacity: 1; transform: none; } }
.hint:active { transform: scale(.94); }
.dk:active, .tile:active { transform: scale(.96); }

/* small motions everywhere */
html, body, #avatar, #dock, .tile.slot, .ov.full, .menu, .dialog, .field, .dbtn, .tabs .t { transition: background-color .45s, color .45s, border-color .45s, box-shadow .2s; }
.swap { animation: swapIn .26s cubic-bezier(.2,.8,.2,1); }
@keyframes swapIn { from { opacity: 0; transform: translateY(calc(var(--u) * .7)); } to { opacity: 1; transform: none; } }
#gameTitle.swap { animation: titleIn .3s cubic-bezier(.2,.8,.2,1); }
@keyframes titleIn { from { opacity: 0; clip-path: inset(0 100% 0 0); } to { opacity: 1; clip-path: inset(0 0 0 0); } }
#dockLabel span.swap { animation: labelIn .26s cubic-bezier(.2,.8,.2,1); }
@keyframes labelIn { from { opacity: 0; transform: translate(-50%, calc(var(--u) * -.8)); } to { opacity: 1; transform: translate(-50%, 0); } }
#hm.swap { animation: tickIn .4s cubic-bezier(.2,.8,.2,1); display: inline-block; }
@keyframes tickIn { from { opacity: 0; transform: translateY(calc(var(--u) * -.8)); } to { opacity: 1; transform: none; } }
.press { animation: press .22s ease !important; }
@keyframes press { 40% { transform: scale(.93); } 100% { transform: scale(1); } }
.dk.sel svg { animation: bob 1.8s ease-in-out infinite; }
@keyframes bob { 50% { transform: scale(1.09); } }
#bat.chg .bolt { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
#padInd.on .leds i:first-child { animation: led 2.4s ease-in-out infinite; }
@keyframes led { 50% { box-shadow: 0 0 calc(var(--u) * .6) #3bd16f; } }
.tile.slot { background-image: linear-gradient(110deg, transparent 30%, rgba(255,255,255,.35) 50%, transparent 70%); background-size: 250% 100%; animation: shimmer 4.5s ease-in-out infinite; }
html[data-theme=black] .tile.slot, html[data-theme=video] .tile.slot { background-image: linear-gradient(110deg, transparent 30%, rgba(255,255,255,.05) 50%, transparent 70%); }
@keyframes shimmer { 0%, 30% { background-position: 120% 0; } 100% { background-position: -120% 0; } }
body.intro #row .tile.slot { animation: tileIn .6s cubic-bezier(.2,.8,.2,1) both, shimmer 4.5s ease-in-out infinite; animation-delay: calc(var(--i, 0) * 55ms + 90ms), 1s; }
body.intro #avatar { animation: popIn .5s cubic-bezier(.3,1.6,.5,1) .1s both; }
#avatar:active { transform: scale(.92); }
@keyframes popIn { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: none; } }
body.intro .dk { animation: popIn .45s cubic-bezier(.3,1.6,.5,1) both; animation-delay: calc(var(--i, 0) * 35ms + 380ms); }
.ov.show .menuItem, .ov.show .dbtn { animation: itemIn .32s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i, 0) * 32ms + 40ms); }
.setRow, .navItem { animation: itemIn .32s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i, 0) * 30ms); }
@keyframes itemIn { from { opacity: 0; transform: translateX(calc(var(--u) * 1.6)); } to { opacity: 1; transform: none; } }
.ov.full.show .ovTitle { animation: titleSlide .4s cubic-bezier(.2,.8,.2,1) both; }
@keyframes titleSlide { from { opacity: 0; transform: translateX(calc(var(--u) * -2)); } to { opacity: 1; transform: none; } }
.ov.full.show .tabs { animation: fadeDown .4s .08s both; }
#hints.swap .hint { animation: swapIn .28s cubic-bezier(.2,.8,.2,1) both; }
#hints.swap .hint:nth-child(2) { animation-delay: .04s; } #hints.swap .hint:nth-child(3) { animation-delay: .08s; }
img.flip { animation: flip .5s cubic-bezier(.2,.8,.2,1); }
@keyframes flip { from { transform: perspective(600px) rotateY(80deg); opacity: 0; } to { transform: none; opacity: 1; } }
.sw i { transition: transform .32s cubic-bezier(.3,1.6,.5,1); }
.tcard .tprev { transition: transform .2s; }
.tcard.cur .tprev { animation: selPop .35s cubic-bezier(.3,1.7,.5,1); }
.tcard.cur .check { animation: popIn .35s cubic-bezier(.3,1.6,.5,1); }
.bar i { transition: width .25s cubic-bezier(.2,.8,.2,1); }
.tabs .t { transition: background-color .25s, color .25s, transform .25s; }
.tabs .t.on { animation: selPop .3s cubic-bezier(.3,1.7,.5,1); }
#toast.show { animation: toastIn .38s cubic-bezier(.3,1.5,.5,1); }
@keyframes toastIn { from { transform: translate(-50%, calc(var(--u) * -2.4)) scale(.94); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
.empty { animation: swapIn .4s both; }
#themeWipe { position: fixed; z-index: 50; pointer-events: none; border-radius: 50%; width: 10px; height: 10px; transform: translate(-50%, -50%) scale(0); animation: wipe .6s cubic-bezier(.4,0,.2,1) forwards; }
@keyframes wipe { 60% { opacity: .9; } to { transform: translate(-50%, -50%) scale(400); opacity: 0; } }

/* ---- even more motion ---- */
/* art lives in a clipping layer so it can drift without spilling out */
.clip { position: absolute; inset: 0; border-radius: inherit; overflow: hidden; }
.sel > .clip img { animation: kenburns 10s ease-in-out infinite alternate; }
@keyframes kenburns { from { transform: scale(1); } to { transform: scale(1.08) translate(-1.5%, -1%); } }
/* selected tile lifts a little */
.tile { transition: transform .28s cubic-bezier(.2,.8,.2,1), box-shadow .28s; }
.tile.g.sel:not(.more) { transform: translateY(calc(var(--u) * -.35)); animation: tileSel .32s cubic-bezier(.3,1.6,.5,1);
  box-shadow: 0 0 0 calc(var(--u) * .2) var(--gapRing), 0 calc(var(--u) * 1.1) calc(var(--u) * 2) calc(var(--u) * -.6) rgba(0,0,0,.28); }
@keyframes tileSel { 0% { transform: translateY(0) scale(.975); } 100% { transform: translateY(calc(var(--u) * -.35)); } }
/* dock icon hops when selected, then breathes */
.dk.sel svg { animation: hop .45s cubic-bezier(.3,1.6,.5,1), bob 1.8s .45s ease-in-out infinite; }
@keyframes hop { 40% { transform: translateY(calc(var(--u) * -.55)) scale(1.12); } 100% { transform: none; } }
/* touch ripple */
.rip { position: absolute; inset: 0; border-radius: inherit; overflow: hidden; pointer-events: none; z-index: 5; }
.rip i { position: absolute; border-radius: 50%; transform: translate(-50%, -50%) scale(0);
  background: radial-gradient(circle, rgba(120,160,255,.42), rgba(120,160,255,0) 70%); animation: rip .6s ease-out forwards; }
@keyframes rip { to { transform: translate(-50%, -50%) scale(1); opacity: 0; } }
/* drifting background glow */
#bgfx { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
#bgfx i { position: absolute; width: 60vmax; height: 60vmax; border-radius: 50%; animation: drift 26s ease-in-out infinite alternate; }
#bgfx i:nth-child(1) { left: -20vmax; top: -25vmax; background: radial-gradient(circle, var(--blob1), transparent 65%); }
#bgfx i:nth-child(2) { right: -22vmax; top: 10vh; background: radial-gradient(circle, var(--blob2), transparent 65%); animation-delay: -9s; animation-duration: 31s; }
#bgfx i:nth-child(3) { left: 20vw; bottom: -35vmax; background: radial-gradient(circle, var(--blob3), transparent 65%); animation-delay: -17s; animation-duration: 35s; }
@keyframes drift { 0% { transform: translate(0, 0) scale(1); } 50% { transform: translate(8vw, 5vh) scale(1.15); } 100% { transform: translate(-4vw, 9vh) scale(.95); } }
html[data-theme=white] { --blob1: rgba(150,185,255,.38); --blob2: rgba(230,180,255,.32); --blob3: rgba(160,230,255,.34); --flash: #ffffff; }
html[data-theme=black] { --blob1: rgba(30,70,170,.32); --blob2: rgba(110,40,150,.26); --blob3: rgba(10,110,130,.26); --flash: #000000; }
html[data-theme=video] #bgfx, html.nobg #bgfx { display: none; }
html[data-theme=video] { --flash: #000000; }
/* clock colon breathes */
#hm .col { animation: colon 2s ease-in-out infinite; padding: 0 .03em; }
@keyframes colon { 50% { opacity: .3; } }
/* launch: screen flashes to the theme colour like the console */
@keyframes flashIn { from { opacity: 0; } to { opacity: 1; } }
/* sliding category marker in settings */
.navBar { position: absolute; left: calc(var(--u) * -.6); width: calc(var(--u) * .3); border-radius: 2px; background: var(--accent);
  transition: top .32s cubic-bezier(.3,1.4,.5,1), height .32s; }
/* wifi bars and battery wake up */
#net svg path, #net svg circle { animation: barIn .5s both; }
#net svg path:nth-of-type(2) { animation-delay: .08s; } #net svg path:nth-of-type(1) { animation-delay: .16s; }
@keyframes barIn { from { opacity: 0; transform: translateY(2px); } }
#avatar { animation: breatheShadow 4s ease-in-out infinite; }
@keyframes breatheShadow { 50% { box-shadow: 0 0 0 calc(var(--u) * .28) var(--gapRing), 0 calc(var(--u) * .5) calc(var(--u) * 1.4) var(--shadow); } }
/* neighbours ease apart from the selected tile */
.tile.nbL { transform: translateX(calc(var(--u) * -.35)); }

  });

function homeMoveBy(d) {

function homePad(b) {

    return;
  }
  if (Hm.zone === 'user') {

      case 'up': Hm.zone = 'user'; Snd.tick(); buzz(); refreshSel(); break;

      case 'l': setMode('games'); break;

      case 'y': Snd.select(); openAll({}); break;
      case 'minus': Snd.select(); openSettings(); break;

    }

    switch (b) {

      case 'right': if (Hm.dockIdx < DOCK.length - 1) { Hm.dockIdx++; Snd.tick(); buzz(); refreshSel(); } else { Snd.bump(); nudge(dockEls[DOCK.length - 1], 1); } break;

    nav.appendChild(e); return e;
  });
  function render() {
    pane.innerHTML = ''; pane.scrollTop = 0;
    items = (o.cats[cat].build(pane) || []).filter(Boolean);
    items.forEach((it, i) => onPress(it.el, () => { focus = 'pane'; sel = i; paint(); if (it.run) { Snd.select(); pressFx(it.el); it.run(); } }));
    sel = clamp(sel, 0, Math.max(0, items.length - 1));
    if (!items.length) focus = 'nav';
    paint(true);
  }
  function paint(noScroll) {
    navEls.forEach((e, i) => { e.classList.toggle('cur', i === cat); e.classList.toggle('sel', focus === 'nav' && i === cat); });
    const ne = navEls[cat]; navBar.style.top = ne.offsetTop + 'px'; navBar.style.height = ne.offsetHeight + 'px';
    items.forEach((it, i) => it.el.classList.toggle('sel', focus === 'pane' && i === sel));
    if (!noScroll && focus === 'pane' && items[sel]) items[sel].el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
  const api = { refresh: () => { render(); }, close: () => popOverlay(true) };
  if (o.modal) onPress(ov, ev => { if (ev.target === ov) popOverlay(); });
  pushOverlay({
    el: ov, full: !o.modal,
    onClose: () => { if (o.ownHints) document.body.classList.remove('swOpen'); },
    pad(b) {
      if (focus === 'nav') {
        if (b === 'up' || b === 'down') { const n = cat + (b === 'up' ? -1 : 1); if (n < 0 || n >= o.cats.length) { Snd.bump(); return; } cat = n; sel = 0; Snd.tick(); buzz(); render(); }
        else if (b === 'right' || b === 'a') { if (items.length) { focus = 'pane'; Snd.tick(); paint(); } else Snd.bump(); }
        else if (b === 'b') popOverlay();
        else Snd.bump();
      } else {
        if (b === 'up' || b === 'down') { const n = sel + (b === 'up' ? -1 : 1); if (n < 0 || n >= items.length) { Snd.bump(); return; } sel = n; Snd.tick(); buzz(); paint(); }
        else if (b === 'left' || b === 'b') { focus = 'nav'; b === 'b' ? Snd.back() : Snd.tick(); paint(); }
        else if (b === 'a') { const it = items[sel]; if (it && it.run) { Snd.select(); pressFx(it.el); it.run(); } else Snd.bump(); }
        else Snd.bump();
      }
    },
    hints: () => o.ownHints ? [] : [['b', 'Back'], ['a', 'OK']],
  });
  drawHints();
  render();
  return api;
}
// A plain row: label (and optional description) with a value on the right.
function paneRow(pane, label, opts) {
  opts = opts || {};
  const e = el('div', 'setRow g' + (opts.danger ? ' danger' : '') + (opts.cls ? ' ' + opts.cls : ''));
  e.innerHTML = `<span class="lbl">${opts.lead || ''}<span>${esc(label)}${opts.desc ? `<span class="desc">${esc(opts.desc)}</span>` : ''}</span></span><span class="val">${opts.val || ''}</span>`;
  pane.appendChild(e);
  return { el: e, run: opts.run };
}

/* =========================================================
   Play time
   ========================================================= */
const playStats = () => { try { return JSON.parse(nb('playStats') || '{}'); } catch (e) { return {}; } };
function fmtPlay(ms) {
  const m = Math.round((ms || 0) / 60000);
  if (m < 1) return 'Less than a minute';
  if (m < 60) return m + (m === 1 ? ' minute' : ' minutes');
  const h = Math.floor(m / 60), r = m % 60;
  return h + (h === 1 ? ' hour' : ' hours') + (r ? ' ' + r + ' min' : '');
}
const fmtPlayShort = ms => { const m = Math.round((ms || 0) / 60000); return m < 60 ? Math.max(1, m) + ' min' : Math.floor(m / 60) + ' h' + (m % 60 ? ' ' + (m % 60) + ' min' : ''); };
const fmtPlayTiny = ms => { const m = Math.round((ms || 0) / 60000); return m < 60 ? Math.max(1, m) + 'm' : Math.floor(m / 60) + 'h' + (m % 60 ? ' ' + (m % 60) + 'm' : ''); };   // for stat cards
const userName = () => (cfg.userName || '').trim() || 'Player';
function avatarHtml(cls) {
  const v = store.get('avatarV', 0);
  return `<span class="${cls}"><span class="avDef">${svg('person')}</span>${NATIVE ? `<img alt="" src="/avatar?v=${v}" onload="this.classList.add('ok')" onerror="this.remove()">` : ''}</span>`;
}
function renameUser(after) {
  openPrompt('Your name', cfg.userName || '', 'Up to 20 characters', v => {
    cfg.userName = v.trim().slice(0, 20); saveCfg(); toast(cfg.userName ? 'Hi, ' + cfg.userName + '!' : 'Name cleared'); after && after();
  });
}

/* =========================================================
   Controllers: see, find and pair Bluetooth controllers
   ========================================================= */
const PAD_TIPS = [
  ['Xbox', 'Hold the small pair button on top until the Xbox button flashes quickly.'],
  ['PlayStation', 'Hold Create (or Share) and the PS button until the light bar flashes.'],
  ['Switch Pro / Joy-Con', 'Hold the small sync button until the lights run back and forth.'],
  ['8BitDo and others', 'Usually: hold the pair button for 3 seconds. Check its manual if the lights don\'t flash.'],
];
function openControllers() {
  const ov = el('section', 'ov full');
  ov.innerHTML = `<div class="ovTitle">${svg('pad')}<span>Controllers</span></div><div class="ovRule"></div><div class="ovRule bottom"></div>
    <div class="padSide"></div><div class="setPane padPane"></div>`;
  const pane = $('.padPane', ov), side = $('.padSide', ov);
  let st = {}, rows = [], rowEls = [], sel = 0, showAll = false, selKey = null;
  const merge = s => { if (PC) s.connected = (navigator.getGamepads ? [...navigator.getGamepads()].filter(Boolean) : []).map(p => ({ id: p.index, name: p.id.replace(/\s*\(.*?\)\s*/g, ' ').trim() || 'Controller', rumble: !!p.vibrationActuator })); return s; };
  const read = () => { try { st = merge(JSON.parse(nb('padsState') || '{}')); } catch (e) { st = {}; } };
  function buildRows() {
    const out = [];
    const conn = st.connected || [], connNames = new Set(conn.map(c => c.name.toLowerCase()));
    if (st.supported === false) { out.push({ head: 'Bluetooth isn\'t available on this device' }); }
    else if (!st.permission) out.push({ key: 'perm', label: 'Allow NSXL to find controllers', desc: 'Lets NSXL search for and pair Bluetooth controllers right here.', val: 'Allow', run: () => nb('padsPermission') });
    else if (!st.enabled) out.push({ key: 'bt', label: 'Bluetooth is off', desc: 'Turn it on to pair a wireless controller.', val: 'Turn on', run: () => nb('padsEnable') });
    out.push({ head: conn.length ? 'Connected' : 'No controllers connected' });
    conn.forEach(c => out.push({ key: 'c' + c.id, label: c.name, pad: true, desc: c.rumble ? 'Select it to make it buzz' : '', val: c.battery != null ? c.battery + '%' : 'Connected', on: true,
      run: () => { if (c.rumble) { if (PC) { const g = navigator.getGamepads()[c.id]; try { g.vibrationActuator.playEffect('dual-rumble', { duration: 350, strongMagnitude: .8, weakMagnitude: .6 }); } catch (e) {} } else nb('padsRumble', c.id); toast('Buzzing ' + c.name); } else Snd.bump(); } }));
    if (st.enabled) {
      const paired = (st.paired || []).filter(d => !connNames.has(d.name.toLowerCase()) && (d.pad || showAll));
      if (paired.length) {
        out.push({ head: 'Paired' });
        paired.forEach(d => out.push({ key: 'p' + d.addr, label: d.name, pad: d.pad, desc: d.connected ? 'Connected' : 'Turn it on to connect', val: d.connected ? 'Connected' : 'Paired',
          run: () => openMenu(d.name, [
            { label: 'Forget this controller', run: () => nb('padsForget', d.addr) },
            { label: 'Open Bluetooth settings', run: () => nb('openSettings', 'bluetooth') },
          ]) }));
      }
      out.push({ head: 'Pair a new controller' });
      out.push({ key: 'scan', label: st.scanning ? 'Searching…' : 'Search for controllers', desc: 'Put your controller in pairing mode first (see the left).', val: st.scanning ? '<i class="spin"></i>Stop' : 'Search',
        run: () => nb(st.scanning ? 'padsStop' : 'padsScan') });
      const found = (st.found || []).filter(d => d.pad || showAll).sort((a, b) => (b.pad - a.pad));
      found.forEach(d => out.push({ key: 'f' + d.addr, label: d.name, pad: d.pad, val: st.pairing === d.addr ? '<i class="spin"></i>Pairing…' : 'Pair',
        run: () => { if (st.pairing) { Snd.bump(); return; } nb('padsPair', d.addr); } }));
      const hidden = (st.found || []).filter(d => !d.pad).length + (st.paired || []).filter(d => !d.pad && !connNames.has(d.name.toLowerCase())).length;
      if (hidden || showAll) out.push({ key: 'all', label: showAll ? 'Only show controllers' : 'Show other Bluetooth devices', desc: showAll ? '' : hidden + ' other ' + (hidden === 1 ? 'device' : 'devices') + ' nearby or paired', val: '',
        run: () => { showAll = !showAll; render(); } });
    }
    return out;
  }
  function render() {
    rows = buildRows();
    pane.innerHTML = ''; rowEls = [];
    rows.forEach((r, i) => {
      if (r.head) { pane.appendChild(el('div', 'padHead', esc(r.head))); rowEls.push(null); return; }
      const e = el('div', 'setRow g' + (r.on ? ' live' : ''));
      e.style.setProperty('--i', i);
      e.innerHTML = `<span class="lbl">${r.pad !== undefined ? `<span class="padIc${r.pad ? '' : ' other'}">${svg(r.pad ? 'pad' : 'bt')}</span>` : ''}<span>${esc(r.label)}${r.desc ? `<span class="desc">${esc(r.desc)}</span>` : ''}</span></span><span class="val">${r.val}</span>`;
      onPress(e, () => { sel = i; paint(); Snd.select(); r.run(); });
      pane.appendChild(e); rowEls.push(e);
    });
    // keep the same row selected when the list changes under it
    let k = rows.findIndex(r => r.key && r.key === selKey);
    if (k < 0) k = Math.min(sel, rows.length - 1);
    while (k < rows.length && !rowEls[k]) k++;
    if (k >= rows.length) { k = rows.length - 1; while (k > 0 && !rowEls[k]) k--; }
    sel = k; paint(true); if (rowEls[sel]) rowEls[sel].scrollIntoView({ block: 'nearest' });
    const n = (st.connected || []).length;
    side.innerHTML = `<div class="padCount"><span class="big">${n}</span><span>${n === 1 ? 'controller connected' : 'controllers connected'}</span></div>
      <div class="padTips"><div class="tipT">Pairing mode</div>${PAD_TIPS.map(([t, d]) => `<div class="tip"><b>${esc(t)}</b><span>${esc(d)}</span></div>`).join('')}</div>`;
  }
  function paint(noScroll) {
    rowEls.forEach((e, i) => e && e.classList.toggle('sel', i === sel));
    selKey = rows[sel] && rows[sel].key;
    if (!noScroll && rowEls[sel]) rowEls[sel].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
  const move = d => { let n = sel + d; while (n >= 0 && n < rows.length && !rowEls[n]) n += d; if (n < 0 || n >= rows.length) { Snd.bump(); return; } sel = n; Snd.tick(); buzz(); paint(); };
  window.onPads = s => { st = merge(s || {}); render(); };
  pushOverlay({
    el: ov, full: true,
    onClose: () => { nb('padsStop'); window.onPads = null; },
    pad(b) {
      if (b === 'up') move(-1); else if (b === 'down') move(1);
      else if (b === 'a') { const r = rows[sel]; if (r && r.run) { Snd.select(); r.run(); } }
      else if (b === 'y') { Snd.select(); nb(st.scanning ? 'padsStop' : 'padsScan'); }
      else if (b === 'b') popOverlay();
      else Snd.bump();
    },
    hints: () => [['b', 'Back'], ['y', st.scanning ? 'Stop' : 'Search'], ['a', 'OK']],
  });
  read(); render();
  // start looking straight away if everything's ready and nothing is connected yet
  if (st.enabled && !(st.connected || []).length) nb('padsScan');
}

/* =========================================================
   Album: your screenshots, grouped by game
   ========================================================= */
const shotThumb = s => NATIVE ? '/shot/' + s.id + '/thumb' : mockShot(s, 480);
const shotFull = s => NATIVE ? '/shot/' + s.id + '/full' : mockShot(s, 1280);
function shotGame(s) {
  if (s.tag && BY[s.tag]) return s.tag;
  const tail = String(s.name || '').replace(/\.[a-z0-9]+$/i, '').replace(/^screenshot[s]?[_\- ]?/i, '').replace(/^[\d_\-. ]+/, '').trim();
  if (!tail) return null;
  if (BY[tail]) return tail;
  const t = tail.replace(/_/g, ' ').toLowerCase();
  const hit = Object.values(BY).find(a => a.label.toLowerCase() === t || (a.orig || '').toLowerCase() === t);

  const items = [...doc.getElementsByTagName('item')].concat([...doc.getElementsByTagName('entry')]).slice(0, 30);
  return items.map(it => {
    const node = n => it.getElementsByTagName(n)[0];
    const text = n => { const x = node(n); return x ? x.textContent.trim() : ''; };
    let link = text('link'); if (!link) { const l = node('link'); link = l ? l.getAttribute('href') || '' : ''; }
    const date = Date.parse(text('pubDate') || text('published') || text('updated') || text('dc:date')) || 0;
    const raw = text('description') || text('summary') || text('content:encoded') || text('content');
    let img = '';
    for (const tag of ['media:content', 'media:thumbnail', 'enclosure']) {
      for (const m of it.getElementsByTagName(tag)) { const u = m.getAttribute('url') || ''; const ty = m.getAttribute('type') || m.getAttribute('medium') || 'image'; if (u && /image/.test(ty) || (u && /\.(jpe?g|png|webp)/i.test(u))) { img = u; break; } }

    return { title, link, date, img: img.startsWith('https://') ? img : '', summary, source, pkg: src.pkg || '' };
  }).filter(x => x.title && x.link && x.link.startsWith('https://'));

/* ---------- all software ---------- */
function openAll(opts) {
  opts = opts || {};
  const ov = el('section', 'ov full');
  ov.innerHTML = `<div class="ovTitle">${svg('grid')}<span>${esc(opts.title || 'All Software')}</span></div>
    <div class="ovRule"></div><div class="ovRule bottom"></div>
    <div class="tabs">${glyph('l')}<span class="t" data-t="games">Games</span><span class="t" data-t="all">All Apps</span>${!opts.mode ? '<span class="t" data-t="folders">Folders</span>' : ''}${glyph('r')}</div>
    <div class="grid"></div>`;
  const grid = $('.grid', ov);
  const TABS = !opts.mode ? ['games', 'all', 'folders'] : ['games', 'all'];
  const multi = opts.mode === 'multi';
  let tab = opts.mode && !multi ? 'all' : (opts.tab || (APPS.some(isGameish) ? 'games' : 'all'));
  let list = [], cells = [], sel = 0, still = false;

  function buildFolders() {
    const fs = folders();
    list = fs.map(f => ({ folder: f.id })).concat({ newFolder: true });
    grid.innerHTML = '';
    cells = list.map((x, i) => {
      const c = el('div', 'cell'), art = el('div', 'art g' + (x.newFolder ? ' addArt' : ''));
      c.style.setProperty('--i', i);
      const f = x.folder && folderBy(x.folder);
      if (f) folderArt(f, art); else art.innerHTML = svg('plus');
      if (f && f.home) art.appendChild(el('span', 'pin', svg('home')));
      c.appendChild(art); c.appendChild(el('div', 'nm', esc(f ? f.name : 'New folder')));
      onPress(c, () => {
        const was = sel === i && c.classList.contains('sel');
        sel = i; paint();
        if (cfg.oneTap || was) act(); else { Snd.tick(); buzz(); }
      }, () => { sel = i; paint(); if (f) folderOptions(f.id); });
      grid.appendChild(c); return c;
    });
    $$('.t', ov).forEach(t => t.classList.toggle('on', t.dataset.t === tab));
    sel = clamp(sel, 0, Math.max(0, cells.length - 1));
    paint(true);
  }
  function build() {
    if (tab === 'folders') return buildFolders();
    const onHome = new Set(homeList()), inF = multi || opts.mode === 'pick' ? new Set() : inFolders();
    list = (tab === 'games' ? APPS.filter(isGameish) : APPS.slice()).filter(a => !inF.has(a.pkg));
    grid.innerHTML = '';
    cells = list.map((a, i) => {
      const c = el('div', 'cell'), art = el('div', 'art g');
      c.style.setProperty('--i', i);
      artBox(a.pkg, 256, art);
      if (multi) { if (opts.selected.has(a.pkg)) art.appendChild(el('span', 'pin chk', svg('check'))); }
      else if (onHome.has(a.pkg)) art.appendChild(el('span', 'pin', svg('home')));
      c.appendChild(art); c.appendChild(el('div', 'nm', esc(a.label)));
      onPress(c, () => {
        const was = sel === i && c.classList.contains('sel');
        sel = i; paint();
        if (cfg.oneTap || was) act(); else { Snd.tick(); buzz(); }
      }, () => { sel = i; paint(); if (!opts.mode) appOptions(a.pkg); });
      grid.appendChild(c); return c;
    });
    grid.classList.toggle('still', still); still = false;
    if (!list.length) grid.appendChild(el('div', 'empty', tab === 'games'
      ? (inF.size ? 'Everything here is in a folder.<br>Find them under <b>Folders</b>.' : 'No games found yet.<br>Switch to <b>All Apps</b> (R) and add any app to Home.')
      : 'No apps found.'));
    $$('.t', ov).forEach(t => t.classList.toggle('on', t.dataset.t === tab));
    sel = clamp(sel, 0, Math.max(0, cells.length - 1));
    paint(true);
  }
  function paint(noScroll) {
    cells.forEach((c, i) => { c.classList.toggle('sel', i === sel); c.firstChild.classList.toggle('sel', i === sel); });
    if (!noScroll) ensure();    if (tab === 'folders') updateHints();
  }
  function cols() {
    if (cells.length < 2) return 1;
    const t0 = cells[0].offsetTop; let n = 0;
    for (const c of cells) { if (c.offsetTop !== t0) break; n++; }
    return Math.max(1, n);
  }
  function ensure() {
    const c = cells[sel]; if (!c) return;
    const g = grid.getBoundingClientRect(), r = c.getBoundingClientRect(), pad = g.height * 0.06;
    if (r.top < g.top + pad) grid.scrollBy({ top: r.top - g.top - pad, behavior: 'smooth' });
    else if (r.bottom > g.bottom - pad) grid.scrollBy({ top: r.bottom - g.bottom + pad, behavior: 'smooth' });
  }
  function move(d) {
    let n = sel + d;
    if (d > 1 && n >= cells.length) {
      const c = cols();
      n = Math.floor(sel / c) < Math.floor((cells.length - 1) / c) ? cells.length - 1 : -1;
    }
    if (n < 0 || n >= cells.length || !cells.length) { Snd.bump(); return; }
    sel = n; Snd.tick(); buzz(); paint();
  }
  function act() {
    const a = list[sel]; if (!a) return;
    if (a.newFolder) { Snd.select(); newFolder(() => { sel = folders().length - 1; }); return; }
    if (a.folder) { Snd.select(); openFolder(a.folder); return; }
    if (multi) { if (opts.selected.has(a.pkg)) opts.selected.delete(a.pkg); else opts.selected.add(a.pkg); Snd.select(); buzz(); still = true; build(); return; }
    if (opts.mode === 'pick') { Snd.select(); popOverlay(true); opts.onPick(a.pkg); }
    else if (opts.mode === 'add') { Snd.select(); popOverlay(true); setOnHome(a.pkg, true); toast('Added ' + a.label + ' to Home'); }
    else launch(a.pkg, cells[sel].firstChild);
  }
  function switchTab(t) {
    if (t === tab) { Snd.bump(); return; }
    grid.classList.remove('fromL', 'fromR', 'still'); grid.classList.add(TABS.indexOf(t) > TABS.indexOf(tab) ? 'fromR' : 'fromL');
    tab = t; sel = 0; Snd.tick(); build(); grid.scrollTop = 0;
  }
  $$('.t', ov).forEach(t => onPress(t, () => switchTab(t.dataset.t)));

  pushOverlay({
    el: ov, full: true,
    pad(b) {
      switch (b) {
        case 'left': move(-1); break;
        case 'right': move(1); break;
        case 'up': move(-cols()); break;
        case 'down': move(cols()); break;
        case 'a': act(); break;
        case 'plus': case 'x': { const x = list[sel];
          if (!opts.mode && x && x.pkg) { Snd.select(); appOptions(x.pkg); }
          else if (x && x.folder) { Snd.select(); folderOptions(x.folder); } else Snd.bump(); break; }
        case 'l': { const i = TABS.indexOf(tab); if (i > 0) switchTab(TABS[i - 1]); else Snd.bump(); break; }
        case 'r': { const i = TABS.indexOf(tab); if (i < TABS.length - 1) switchTab(TABS[i + 1]); else Snd.bump(); break; }
        case 'b': popOverlay(); break;
      }
    },
    hints: () => multi ? [['b', 'Done'], ['a', 'Select']] : opts.mode ? [['b', 'Back'], ['a', opts.mode === 'pick' ? 'Choose' : 'Add']]
      : tab === 'folders' ? [['b', 'Back'], ['plus', 'Options'], ['a', list[sel] && list[sel].newFolder ? 'Make' : 'Open']] : [['b', 'Back'], ['plus', 'Options'], ['a', 'Start']],
    onClose: () => { if (multi && opts.onDone) opts.onDone(opts.selected); },
    refresh: build,
  });
  build();
}

/* ---------- folders: group games, pin a folder to Home, choose the order inside ---------- */
const FOLDER_SORTS = [['custom', 'Your order'], ['az', 'Name (A–Z)'], ['za', 'Name (Z–A)'], ['recent', 'Recently played'], ['most', 'Most played']];
const folders = () => store.get('folders', []);
const folderBy = id => folders().find(f => f.id === id);
function editFolder(id, fn) {
  const all = folders(), f = all.find(x => x.id === id); if (!f) return;
  if (fn(f, all) === 'delete') all.splice(all.indexOf(f), 1);
  store.set('folders', all); renderRow(); refreshOverlays();
}
function folderApps(f) {
  const ids = (f.apps || []).filter(p => BY[p]), st = (f.sort === 'recent' || f.sort === 'most') ? playStats() : {};
  const name = (a, b) => BY[a].label.localeCompare(BY[b].label, undefined, { sensitivity: 'base' });
  if (f.sort === 'az') ids.sort(name);
  else if (f.sort === 'za') ids.sort((a, b) => name(b, a));
  else if (f.sort === 'recent') ids.sort((a, b) => ((st[b] || {}).last || 0) - ((st[a] || {}).last || 0));
  else if (f.sort === 'most') ids.sort((a, b) => ((st[b] || {}).ms || 0) - ((st[a] || {}).ms || 0));
  return ids;
}
function folderArt(f, box) {
  const ids = folderApps(f), g = el('div', 'fGrid');
  if (!ids.length) g.classList.add('none');
  ids.slice(0, 4).forEach(p => { const m = el('div'); artBox(p, 256, m); g.appendChild(m); });
  if (!ids.length) g.innerHTML = svg('folder');
  box.appendChild(g);
  box.appendChild(el('span', 'fBadge', svg('folder') + '<b>' + ids.length + '</b>'));
}
function newFolder(then) {
  openPrompt('New folder', '', 'Folder name', v => {

}
function folderSortMenu(id) {

  openMenu('Sort games by', FOLDER_SORTS.map(([k, l]) => ({ label: ((f.sort || 'custom') === k ? '✓  ' : '') + l,
    run: () => { editFolder(id, f => { f.sort = k; }); toast('Sorted by ' + l.toLowerCase()); } })));
}
function folderOptions(id) {
  const f = folderBy(id); if (!f) return;
  openMenu(f.name, [
    { label: 'Sort games…', run: () => folderSortMenu(id) },
    { label: 'Rename', run: () => openPrompt('Rename folder', f.name, 'Folder name', v => { v = v.trim(); if (v) editFolder(id, f => { f.name = v; }); }) },
    f.home ? { label: 'Move on Home', run: () => startHomeMove('folder:' + id) } : null,
    { label: f.home ? 'Remove from Home' : 'Show on Home', run: () => { editFolder(id, f => { f.home = !f.home; }); toast(f.home ? 'Removed from Home' : 'Folder added to Home'); } },
    { label: 'Delete folder', danger: true, run: () => openDialog('Delete “' + f.name + '”?', 'The games stay in All Software. Only the folder goes.',
        [{ label: 'Cancel', cancel: true }, { label: 'Delete', primary: true, run: () => { editFolder(id, () => 'delete'); while (stack.some(o => o.folder === id)) popOverlay(true); toast('Folder deleted'); } }]) },
  ]);

function folderPicker(pkg, done) {

  openMenu('Folders for ' + a.label, folders().map(f => {
    const inIt = f.apps.includes(pkg);
    return { label: (inIt ? '✓  ' : '') + f.name, run: () => {

function openFolder(id) {   // a Home-style row of just this folder's games
  const ov = el('section', 'ov full fHome');
  ov.innerHTML = `<div class="ovTitle">${svg('folder')}<span></span></div>
    <div class="ovRule bottom"></div>
    <div class="fSortChip g"></div>
    <div class="fTitle"></div>
    <div class="fRowWrap"><div class="fRow"></div></div>`;
  const row = $('.fRow', ov), wrap = $('.fRowWrap', ov), title = $('.fTitle', ov), chip = $('.fSortChip', ov);
  let list = [], tiles = [], sel = 0, moving = false, dragFrom = -1;
  onPress(chip, () => { Snd.select(); folderSortMenu(id); });

  function build(keepOrder) {
    const f = folderBy(id); if (!f) return;
    $('.ovTitle span', ov).textContent = f.name;
    chip.innerHTML = svg('sort') + '<span>' + esc((FOLDER_SORTS.find(s => s[0] === (f.sort || 'custom')) || FOLDER_SORTS[0])[1]) + '</span>' + glyph('y');
    if (!keepOrder) list = folderApps(f);
    row.innerHTML = '';
    tiles = list.map((pkg, i) => {
      const t = el('div', 'tile g'); artBox(pkg, 512, t);
      t.style.setProperty('--i', i);
      onPress(t, () => {
        if (moving) { finishMove(); return; }
        const was = sel === i && t.classList.contains('sel');
        sel = i; paint();
        if (cfg.oneTap || was) act(); else { Snd.tick(); buzz(); }
      }, () => { sel = i; paint(); gameMenu(); });
      // mouse: drag a game onto another spot
      t.draggable = true;
      t.addEventListener('dragstart', e => { dragFrom = i; e.dataTransfer.effectAllowed = 'move'; t.classList.add('lift'); });
      t.addEventListener('dragend', () => { dragFrom = -1; $$('.lift, .dropAt', row).forEach(x => x.classList.remove('lift', 'dropAt')); });
      t.addEventListener('dragover', e => { if (dragFrom < 0) return; e.preventDefault(); t.classList.add('dropAt'); });
      t.addEventListener('dragleave', () => t.classList.remove('dropAt'));
      t.addEventListener('drop', e => { e.preventDefault(); if (dragFrom < 0 || dragFrom === i) return;
        const [p] = list.splice(dragFrom, 1); list.splice(i, 0, p); sel = i; dragFrom = -1; save(); });
      row.appendChild(t); return t;
    });
    chip.style.display = list.length ? '' : 'none';
    if (!list.length) row.appendChild(el('div', 'fEmpty', 'This folder is empty.<br>Add a game from its <b>Options › Folders</b>.'));
    sel = clamp(sel, 0, Math.max(0, tiles.length - 1));
    paint();
  }
  function paint() {
    tiles.forEach((t, i) => { t.classList.toggle('sel', i === sel); t.classList.toggle('lift', moving && i === sel); });
    const t = tiles[sel];
    if (t) {
      const r = t.offsetLeft - wrap.scrollLeft, w = wrap.clientWidth;
      if (r < w * .08 || r + t.offsetWidth > w * .92) wrap.scrollTo({ left: t.offsetLeft - w * .08, behavior: 'smooth' });
      const name = BY[list[sel]] ? BY[list[sel]].label : '';
      if (title.dataset.txt !== name) { title.dataset.txt = name; title.innerHTML = '<span>' + esc(name) + '</span>'; retrigger(title, 'swap'); }
      requestAnimationFrame(() => { title.style.transform = `translateX(${wrap.getBoundingClientRect().left + t.offsetLeft - wrap.scrollLeft}px)`; });
      title.style.opacity = 1;
    } else title.style.opacity = 0;
    updateHints();
  }
  wrap.addEventListener('scroll', () => { const t = tiles[sel]; if (t) title.style.transform = `translateX(${wrap.getBoundingClientRect().left + t.offsetLeft - wrap.scrollLeft}px)`; });
  function save() {   // the order on screen becomes "Your order"
    const f = folderBy(id), was = f && (f.sort || 'custom');
    editFolder(id, f => { f.apps = list.concat(f.apps.filter(p => !list.includes(p))); f.sort = 'custom'; });
    if (was && was !== 'custom') toast('Now sorted by your order');
  }
  function move(d) {
    const n = sel + d;
    if (n < 0 || n >= tiles.length) { Snd.bump(); if (tiles[sel]) nudge(tiles[sel], d); return; }
    if (moving) {
      const [p] = list.splice(sel, 1); list.splice(n, 0, p);
      const a = tiles[sel], b = tiles[n]; tiles[sel] = b; tiles[n] = a;
      if (d > 0) row.insertBefore(b, a); else row.insertBefore(a, b);
    }
    sel = n; Snd.tick(); buzz(); paint();
  }
  function startMove() {
    if (!list.length) { Snd.bump(); return; }
    moving = true; Snd.select(); paint(); toast('Move it with ◀ ▶, then press A');
  }
  function finishMove() { moving = false; Snd.select(); save(); }
  function gameMenu() {
    const pkg = list[sel]; if (!pkg) { Snd.bump(); return; }
    openMenu(BY[pkg].label, [
      { label: 'Move', run: startMove },
      { label: 'Remove from folder', run: () => { editFolder(id, f => { f.apps = f.apps.filter(p => p !== pkg); }); toast('Removed from folder. It\'s back in All Software.'); } },
      { label: 'Software options…', run: () => appOptions(pkg) },
    ]);
  }
  function act() {
    if (moving) { finishMove(); return; }
    if (!list.length) { Snd.bump(); return; }
    launch(list[sel], tiles[sel]);
  }

  pushOverlay({
    el: ov, full: true, folder: id,
    pad(b) {
      switch (b) {
        case 'left': move(-1); break;
        case 'right': move(1); break;
        case 'up': case 'down': Snd.bump(); break;
        case 'a': act(); break;
        case 'b': if (moving) finishMove(); else popOverlay(); break;
        case 'plus': case 'x': if (!moving) { Snd.select(); gameMenu(); } break;
        case 'y': if (!moving) { Snd.select(); folderSortMenu(id); } break;
        case 'minus': if (!moving) { Snd.select(); folderOptions(id); } break;
      }
    },
    hints: () => moving ? [['a', 'Put here']] : list.length ? [['b', 'Back'], ['minus', 'Folder'], ['y', 'Sort'], ['plus', 'Options'], ['a', 'Start']] : [['b', 'Back'], ['minus', 'Folder']],
    refresh: () => { if (!moving) build(); },
  });
  requestAnimationFrame(() => build());
}

function openSettings(startCat) {
  const ov = el('section', 'ov full');
  ov.innerHTML = `<div class="ovTitle">${svg('gear')}<span>Launcher Settings</span></div><div class="ovRule"></div><div class="ovRule bottom"></div>
    <nav class="setNav"></nav><div class="setPane"></div>`;
  const nav = $('.setNav', ov), pane = $('.setPane', ov);
  let cat = startCat || 0, focus = 'nav', row = 0, rows = [], rowEls = [];
  let tIdx = Math.max(0, THEMES.findIndex(t => t[0] === cfg.theme));

  const navBar = el('i', 'navBar'); nav.appendChild(navBar);
  const navEls = SETTINGS.map((s, i) => {
    const e = el('div', 'navItem g', esc(s.name));
    e.style.setProperty('--i', i);
    onPress(e, () => { if (cat !== i) { cat = i; row = 0; renderPane(); } focus = 'nav'; Snd.tick(); paint(); });
    nav.appendChild(e); return e;
  });

  function renderPane() {
    rows = SETTINGS[cat].rows().filter(Boolean);
    row = clamp(row, 0, rows.length - 1);
    pane.innerHTML = '';
    rowEls = rows.map((r, i) => { const e = rowEl(r, i); pane.appendChild(e); return e; });
  }
  function rowEl(r, i) {
    const e = el('div', 'setRow g ' + r.type);
    e.style.setProperty('--i', i);
    if (r.type === 'themes') {
      e.innerHTML = `<span class="lbl">${esc(r.label)}</span><div class="tcards"></div>`;
      const box = $('.tcards', e);
      THEMES.forEach(([id, name], k) => {
        const c = el('div', 'tcard' + (cfg.theme === id ? ' cur' : ''),
          `<div class="tprev ${id} g"><div class="in"><i></i><i></i><i></i><i></i><b></b></div><span class="check">${svg('check')}</span></div>${esc(name)}`);
        onPress(c, () => { row = i; focus = 'pane'; tIdx = k; paint(); setTheme(id); });
        box.appendChild(c);
      });
      return e;
    }
    const desc = typeof r.desc === 'function' ? r.desc() : r.desc;
    e.innerHTML = `<span class="lbl"><span>${esc(r.label)}${desc ? `<span class="desc">${esc(desc)}</span>` : ''}</span></span><span class="val"></span>`;
    fillVal(r, $('.val', e));
    onPress(e, ev => {
      row = i; focus = 'pane'; paint();
      if (r.type === 'slider') {
        const bar = $('.bar', e), br = bar.getBoundingClientRect();
        if (ev.clientX >= br.left - 10 && ev.clientX <= br.right + 10) {
          const f = clamp((ev.clientX - br.left) / br.width, 0, 1);
          r.set(Math.round((r.min + f * (r.max - r.min)) / r.step) * r.step); Snd.step(); fillVal(r, $('.val', e)); return;
        }
        adjust(r, 1); return;
      }
      activate(r);
    });
    return e;
  }
  function fillVal(r, v) {
    if (r.type === 'toggle') v.innerHTML = `<span class="sw${tGet(r) ? ' on' : ''}"><i></i></span>`;
    else if (r.type === 'choice') { const o = r.options.find(x => x[0] === (r.get ? r.get() : cfg[r.key])) || r.options[0]; v.innerHTML = `<span class="arr">‹</span>${esc(o[1])}<span class="arr">›</span>`; }
    else if (r.type === 'slider') { const val = r.get(), p = (val - r.min) / (r.max - r.min) * 100; v.innerHTML = `<span class="bar"><i style="width:${p}%"></i></span><span class="num">${esc(r.fmt(val))}</span>`; }
    else if (r.type === 'action') v.innerHTML = `${esc(r.value ? r.value() : '')}<span class="chev">›</span>`;
    else if (r.type === 'info') v.textContent = r.value();
  }
  function refreshRow(i) { const r = rows[i], e = rowEls[i]; if (r && e && r.type !== 'themes') { fillVal(r, $('.val', e)); if (typeof r.desc === 'function' && $('.desc', e)) $('.desc', e).textContent = r.desc(); } }
  function activate(r) {
    pressFx(rowEls[row]);
    if (r.type === 'toggle') { tSet(r, !tGet(r)); saveCfg(); r.after && r.after(); tGet(r) ? Snd.on() : Snd.off(); buzz(); refreshRow(row); }
    else if (r.type === 'choice') adjust(r, 1);
    else if (r.type === 'action') { Snd.select(); r.run(); }
    else if (r.type === 'slider') adjust(r, 1);
    else if (r.type === 'themes') setTheme(THEMES[tIdx][0]);
  }
  function adjust(r, d) {
    if (r.type === 'choice') {
      const k = r.options.findIndex(x => x[0] === (r.get ? r.get() : cfg[r.key]));
      const nv = r.options[(k + d + r.options.length) % r.options.length][0];
      if (r.set) r.set(nv); else cfg[r.key] = nv;
      saveCfg(); r.after && r.after(); Snd.tick(); buzz(); refreshRow(row); return true;
    }
    if (r.type === 'slider') {
      const v = clamp(Math.round((r.get() + d * r.step) / r.step) * r.step, r.min, r.max);
      if (Math.abs(v - r.get()) < 1e-9) { Snd.bump(); return true; }
      r.set(+v.toFixed(3)); Snd.step(); refreshRow(row); return true;
    }
    if (r.type === 'toggle') {
      const want = d > 0; if (tGet(r) === want) { Snd.bump(); return true; }
      tSet(r, want); saveCfg(); r.after && r.after(); want ? Snd.on() : Snd.off(); refreshRow(row); return true;
    }
    if (r.type === 'themes') {
      const n = tIdx + d;
      if (n < 0) return false;
      if (n >= THEMES.length) { Snd.bump(); return true; }
      tIdx = n; Snd.tick(); buzz(); paint(); return true;
    }
    return false;
  }
  function paint() {
    navEls.forEach((e, i) => { e.classList.toggle('cur', i === cat); e.classList.toggle('sel', focus === 'nav' && i === cat); });
    const ce = navEls[cat]; if (ce) { navBar.style.top = (ce.offsetTop + ce.offsetHeight * .2) + 'px'; navBar.style.height = (ce.offsetHeight * .6) + 'px'; }
    if (ce && focus === 'nav') ce.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    rowEls.forEach((e, i) => e.classList.toggle('sel', focus === 'pane' && i === row && rows[i].type !== 'themes'));
    rowEls.forEach((e, i) => {
      if (rows[i].type !== 'themes') return;
      $$('.tcard', e).forEach((c, k) => {
        c.classList.toggle('cur', THEMES[k][0] === cfg.theme);
        $('.tprev', c).classList.toggle('sel', focus === 'pane' && i === row && k === tIdx);
      });
    });
    const e = rowEls[row];
    if (focus === 'pane' && e) e.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
  renderPane();
  pushOverlay({
    el: ov, full: true,
    pad(b) {
      if (focus === 'nav') {
        if (b === 'up' || b === 'down') {
          const n = cat + (b === 'up' ? -1 : 1);
          if (n < 0 || n >= SETTINGS.length) { Snd.bump(); return; }
          cat = n; row = 0; Snd.tick(); buzz(); renderPane(); paint();
        } else if (b === 'right' || b === 'a') { focus = 'pane'; row = 0; tIdx = Math.max(0, THEMES.findIndex(t => t[0] === cfg.theme)); Snd.tick(); paint(); }
        else if (b === 'b') popOverlay();
      } else {
        const r = rows[row];
        if (b === 'up' || b === 'down') {
          const n = row + (b === 'up' ? -1 : 1);
          if (n < 0 || n >= rows.length) { Snd.bump(); return; }
          row = n; Snd.tick(); buzz(); paint();
        } else if (b === 'left') { if (!adjust(r, -1)) { focus = 'nav'; Snd.tick(); paint(); } }
        else if (b === 'right') { if (!adjust(r, 1)) Snd.bump(); }
        else if (b === 'a') activate(r);
        else if (b === 'b') { focus = 'nav'; Snd.back(); paint(); }
      }
    },
    hints: () => [['b', 'Back'], ['a', 'OK']],
    refresh() { renderPane(); paint(); },
  });
  paint();
}

/* =========================================================
   Status bar: clock, wifi, battery, controller
   ========================================================= */
let sys24 = false;
function updateClock() {
  const d = new Date(); let h = d.getHours(); const m = String(d.getMinutes()).padStart(2, '0');
  const use24 = cfg.clock === '24' || (cfg.clock === 'system' && sys24);
  let txt;
  if (use24) { txt = h + ':' + m; $('#ampm').textContent = ''; }
  else { $('#ampm').textContent = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; txt = h + ':' + m; }
  const hm = $('#hm');
  if (hm.textContent !== txt) {
    const first = hm.textContent === '--:--', [a, b] = txt.split(':');
    hm.innerHTML = esc(a) + '<span class="col">:</span>' + esc(b);
    if (!first) retrigger(hm, 'swap');
  }
}
function updateStatus() {
  let st = {};
  try { st = JSON.parse(nb('getStatus') || '{}'); } catch (e) {}
  if (PC) st = pcStatus(st);
  sys24 = !!st.time24;
  const lvl = st.battery == null ? 100 : st.battery;
  const bat = $('#bat');
  bat.innerHTML = batterySvg(lvl, !!st.charging);
  bat.classList.toggle('chg', !!st.charging);
  bat.classList.toggle('low', !st.charging && lvl <= 15);
  $('#batPct').textContent = cfg.batPct ? lvl + '%' : '';
  $('#net').innerHTML = st.net === 'cell' ? cellSvg(st.bars || 0) : wifiSvg(st.bars || 0, st.net === 'wifi' || st.net === 'ethernet');
  $('#padInd').classList.toggle('on', (st.pads || 0) > 0);
  updateClock();
}

/* =========================================================
   Toast
   ========================================================= */
let toastT = 0;
function showToast(msg, ms) {
  const t = $('#toast'); if (!t.classList.contains('show') || t.dataset.msg !== msg) Snd.toast(); t.dataset.msg = msg; t.innerHTML = '<span>' + esc(msg) + '</span>'; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(hideToast, ms || 2200);
}
function hideToast() { $('#toast').classList.remove('show'); }
const toast = msg => showToast(msg, 2200);
window.toast = toast;

/* =========================================================
   Input from the native side (controller / keys)
   ========================================================= */
let lastPad = { b: '', t: 0 };
window.onPad = (b, repeat, fromTouch) => {
  if (!fromTouch && Input.mode !== 'pad') setInputMode('pad');
  if ($('#bootFx').classList.contains('on') && window.__bootSkip) { window.__bootSkip(); return; }
  const now = performance.now();
  if (!repeat && !fromTouch && b === lastPad.b && now - lastPad.t < 70) return;  // drop duplicate d-pad events
  lastPad = { b, t: now };
  Snd.unlock();
  const top = topOverlay();
  if (top) top.pad(b, repeat); else homePad(b, repeat);
};
window.onPauseApp = () => Music.pause();

    if (closed || busy) return; busy = true;
    try {
      const key = state ? JSON.stringify([state.session && state.session.title, state.spotify && state.spotify.title]) : '';
      const next = await nbAsync('musicState', !state || key !== lastKey);
      if (state && next.session && !next.session.art && state.session && next.session.title === state.session.title) next.session.art = state.session.art;
      state = next; lastKey = JSON.stringify([state.session && state.session.title, state.spotify && state.spotify.title]);
      if (state.connected && lists == null) nbAsync('spotifyLists').then(l => { lists = l; build(); }).catch(() => { lists = []; build(); });
      const sel = rowsEl[focus.r] && rowsEl[focus.r][focus.c];
      build();
    } catch (e) { } finally { busy = false; }
  }
  pushOverlay({
    el: ov, full: true,
    onClose: () => { closed = true; clearInterval(timer); },
    pad(b) {
      const r = rowsEl[focus.r] || [], cur = r[focus.c];
      if (b === 'up' || b === 'down') { const n = focus.r + (b === 'up' ? -1 : 1); if (n < 0 || n >= rowsEl.length) { Snd.bump(); return; } const x = cur ? cur.getBoundingClientRect().left : 0; focus.r = n; const nr = rowsEl[n]; let best = 0, bd = 1e9; nr.forEach((e, j) => { const d = Math.abs(e.getBoundingClientRect().left - x); if (d < bd) { bd = d; best = j; } }); focus.c = best; Snd.tick(); buzz(); paint(); }
      else if (b === 'left' || b === 'right') { if (cur && cur._adjust) { cur._adjust(b === 'left' ? -1 : 1); Snd.tick(); return; } const n = focus.c + (b === 'left' ? -1 : 1); if (n < 0 || n >= r.length) { Snd.bump(); return; } focus.c = n; Snd.tick(); buzz(); paint(); }
      else if (b === 'a') { if (cur && cur._run) { Snd.select(); cur._run(); } else Snd.bump(); }
      else if (b === 'x') { Snd.select(); cmd('toggle'); }
      else if (b === 'l') { Snd.select(); cmd('prev'); } else if (b === 'r') { Snd.select(); cmd('next'); }
      else if (b === 'b') popOverlay();
    },
    hints: () => [['b', 'Back'], ['x', 'Play/Pause'], ['a', 'OK']],
  });
  build();
  poll(); timer = setInterval(poll, 1500);
}

function pcPower() {
  const sure = (title, msg, kind) => openDialog(title, msg, [{ label: 'Cancel', cancel: true }, { label: title.replace('?', ''), primary: true, run: () => nb('power', kind) }]);

    { label: 'Quick menu', run: () => setTimeout(() => nb('overlayTest'), 250) },
    { label: 'Sleep', run: () => nb('power', 'sleep') },
    { label: 'Exit to desktop', run: () => nb('power', 'minimize') },
    { label: 'Restart NSXL', run: () => nb('reload') },
    { label: 'Quit NSXL', run: () => nb('power', 'quit') },
    { label: 'Restart PC', run: () => sure('Restart PC?', 'Your PC restarts straight away. Save anything open first.', 'restart') },
    { label: 'Shut down', run: () => sure('Shut down?', 'Your PC turns off straight away. Save anything open first.', 'shutdown') },
  ]);
}
if (PC) {
  document.documentElement.classList.add('pc');
  cfg.entTab = false;   // streaming apps are an Android thing
  openPower = pcPower;
  const st = DOCK_ALL.find(d => d.id === 'store'); if (st) { st.label = 'Steam Store'; }
  const mu = DOCK_ALL.find(d => d.id === 'music'); if (mu) { delete mu.cat; mu.run = () => openMusic(); }
  Object.assign(window, { updateStatus, openControllers, openMusic, refreshOverlays });
  if (navigator.getBattery) navigator.getBattery().then(b => { pcBattery = b; ['levelchange', 'chargingchange'].forEach(e => b.addEventListener(e, updateStatus)); updateStatus(); }).catch(() => {});

  // Settings: drop the Android-only parts, add Library and Windows options

  SETTINGS.forEach(c => { const f = c.rows; c.rows = () => (f() || []).filter(r => !r || !dropRows.has(r.label)); });
  const lib = () => { try { return JSON.parse(nb('libraryInfo') || '{}'); } catch (e) { return {}; } };
  const steamOpt = () => { try { return JSON.parse(nb('steamOpts') || '{}'); } catch (e) { return {}; } };
  const games = n => (n || 0) + ((n || 0) === 1 ? ' game' : ' games');
  SETTINGS.splice(1, 0, { name: 'Library', rows: () => { const L = lib(); return [
    { type: 'action', label: 'Add a game or app', desc: 'Pick an .exe, a shortcut, or an internet shortcut (like steam://). It joins your games.', value: () => 'Add', run: () => nb('addGame') },
    { type: 'action', label: 'Look for new games', desc: 'Checks Steam and the Epic Games Launcher again.', value: () => 'Scan', run: () => { nb('rescan'); toast('Library updated'); refreshOverlays(); } },
    { type: 'info', label: 'Steam', value: () => L.steamFound ? games(L.steam) : 'Not found' },
    { type: 'toggle', label: 'Start Steam quietly', desc: 'Steam games need Steam running. NSXL starts it in the background, with no window, so games open faster.', key: '_steamQuiet',
      get: () => steamOpt().quiet !== false, set: v => nb('setSteamOpt', 'quiet', v) },
    { type: 'toggle', label: 'Hide Steam while games start', desc: 'Keeps Steam\'s pop-ups behind the game intro until your game appears. Anything that needs an answer still comes through.', key: '_steamCover',
      get: () => steamOpt().cover !== false, set: v => nb('setSteamOpt', 'cover', v) },
    { type: 'info', label: 'Epic Games', value: () => games(L.epic) },
    { type: 'info', label: 'Added by you', value: () => games(L.custom) },
  ]; } });
  const sp = () => { try { return JSON.parse(nb('spotifyInfo') || '{}'); } catch (e) { return {}; } };
  SETTINGS.splice(SETTINGS.findIndex(c => c.name === 'Sound') + 1, 0, { name: 'Music', rows: () => { const S = sp(); return [
    { type: 'info', label: 'Spotify', value: () => S.connected ? 'Connected ✓' : S.clientId ? 'Not connected' : 'Not set up' },
    { type: 'action', label: 'Spotify Client ID', desc: 'Create a free app at developer.spotify.com › Dashboard, add the redirect URI below, then paste its Client ID here.',
      value: () => S.clientId ? 'Set ✓' : 'Add', run: () => openPrompt('Spotify Client ID', S.clientId || '', 'Paste the Client ID', v => { nb('spotifySetClient', v); refreshOverlays(); toast(v.trim() ? 'Client ID saved. Now choose Connect.' : 'Client ID removed'); }) },
    { type: 'info', label: 'Redirect URI', value: () => S.redirect || 'http://127.0.0.1:8973/callback' },
    { type: 'action', label: 'Copy redirect URI', value: () => 'Copy', run: () => { nb('copyText', S.redirect || 'http://127.0.0.1:8973/callback'); toast('Copied'); } },
    S.connected ? { type: 'action', label: 'Disconnect Spotify', value: () => '', run: () => { nb('spotifyLogout'); refreshOverlays(); toast('Spotify disconnected'); } }
                : { type: 'action', label: 'Connect Spotify', desc: 'Signs in through your web browser. Controlling playback needs Spotify Premium.', value: () => 'Connect',
                    run: () => { if (!S.clientId) { toast('Add your Spotify Client ID first'); return; } toast('Finish signing in in your browser…'); nbAsync('spotifyLogin').then(() => { toast('Spotify connected'); refreshOverlays(); }).catch(e => toast(String(e))); } },
    { type: 'info', label: 'Without an account', value: () => 'Play/pause and skip still work' },
  ]; } });
  const vpn = () => { try { return JSON.parse(nb('vpnState') || '{}'); } catch (e) { return {}; } };
  window.onVpn = () => refreshOverlays();
  const sec = () => { try { return JSON.parse(nb('secondState') || '{}'); } catch (e) { return {}; } };
  SETTINGS.splice(SETTINGS.findIndex(c => c.name === 'Home Screen') + 1, 0, { name: 'Second Screen', rows: () => { const S = sec(); return [
    { type: 'choice', label: 'Second screen', desc: 'When another monitor is plugged in, it fills with big artwork of the game you have selected.', key: '_second',
      get: () => S.mode || 'off', set: v => { S.mode = v; nb('setSecond', 'secondScreen', v); }, options: [['off', 'Off'], ['art', 'Game artwork']] },
    { type: 'info', label: 'Monitors found', value: () => S.screens > 1 ? String(S.screens) : '1 (plug in another to use this)' },
    { type: 'toggle', label: 'Fetch banners from SteamGridDB', desc: 'Downloads a banner and logo the first time you select a game. Steam games use Steam\'s own art first. Needs your key in Cover Art.', key: '_secondSgdb',
      get: () => S.sgdb !== false, set: v => { S.sgdb = v; nb('setSecond', 'secondSgdb', v); } },
    { type: 'toggle', label: 'Show game logos', desc: 'Puts the game\'s logo over its banner.', key: '_secondLogo',
      get: () => S.logo !== false, set: v => { S.logo = v; nb('setSecond', 'secondLogo', v); } },
    { type: 'info', label: 'Your own artwork', value: () => 'Press + on a game › Cover Art' },
  ]; } });
  SETTINGS.splice(SETTINGS.findIndex(c => c.name === 'System'), 0, { name: 'VPN', rows: () => { const V = vpn(); if (!V.installed) return [
    { type: 'info', label: 'Private Internet Access', value: () => 'Not installed' },
    { type: 'action', label: 'Get the PIA app', desc: 'Install it and sign in once; NSXL then switches it on and off for you.', value: () => '', run: () => nb('openBrowser', 'https://www.privateinternetaccess.com/download/windows-vpn') },
  ]; return [
    { type: 'toggle', label: 'VPN', desc: 'Private Internet Access · ' + (V.connection || 'Unknown') + (V.ip ? ' · ' + V.ip : ''), key: '_vpn',
      get: () => V.connection === 'Connected' || V.connection === 'Connecting', set: v => { V.connection = v ? 'Connecting' : 'Disconnecting'; toast(v ? 'Connecting…' : 'Disconnecting…'); nbAsync('vpnSet', v).catch(e => toast(String(e))); } },
    { type: 'choice', label: 'Region', key: '_vpnRegion', get: () => V.region || 'auto',
      options: [['auto', 'Fastest']].concat((V.regions || []).filter(r => r !== 'auto').map(r => [r, r.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase())])),
      set: v => { V.region = v; nbAsync('vpnRegion', v).then(() => toast('Region set')).catch(e => toast(String(e))); } },
    { type: 'toggle', label: 'Connect when NSXL starts', key: '_vpnAuto', get: () => !!nb('vpnAuto'), set: v => nb('setVpnAuto', v) },
  ]; } });
  const ctl = SETTINGS.find(c => c.name === 'Controls');
  if (ctl) { const f = ctl.rows; ctl.rows = () => (f() || []).concat([
    { type: 'choice', label: 'Quick menu button', desc: 'Opens the quick menu over a game. Works with Xbox-style (XInput) controllers. If you pick the Xbox button, turn off "Open Xbox Game Bar using this button" in Windows settings.', key: '_menuBtn',
      get: () => nb('menuButton') || 'viewmenu', set: v => nb('setMenuButton', v), options: [['viewmenu', 'View + Menu'], ['guide', 'Xbox button'], ['both', 'Either']] },
    { type: 'action', label: 'Try the quick menu', desc: (() => { let m = {}; try { m = JSON.parse(nb('menuInfo') || '{}'); } catch (e) { }
        return (m.shortcut ? 'Keyboard: ' + m.shortcut + '. ' : 'No keyboard shortcut was free. ') + (m.xinput ? m.xinput + ' Xbox-style controller' + (m.xinput > 1 ? 's' : '') + ' found.' : 'No Xbox-style controller found: PlayStation and Switch controllers need Steam open, or use the keyboard.'); })(),
      value: () => 'Open', run: () => nb('overlayTest') },
  ]); }
  const sys = SETTINGS.find(c => c.name === 'System');
  const fse = () => { try { return JSON.parse(nb('fseState') || '{}'); } catch (e) { return {}; } };
  if (sys) sys.rows = () => [
    { type: 'action', label: 'Xbox mode home app', desc: 'Lets Windows open NSXL instead of the Xbox app in Xbox mode (full screen experience). Needs Windows 11 24H2 or later; Windows asks for permission once.',
      value: () => fse().installed ? 'Set up ✓' : 'Set up', run: () => fse().installed
        ? openMenu('Xbox mode', [{ label: 'Open Windows gaming settings', run: () => nb('openUrl', 'ms-settings:gaming') }, { label: 'Remove NSXL from Xbox mode', run: () => nb('fseRemove') }])
        : nb('fseInstall') },
    { type: 'toggle', label: 'Start NSXL with Windows', desc: 'Opens NSXL when you sign in, like a console.', key: '_autostart', get: () => !!nb('autoStart'), set: v => nb('setAutoStart', v) },
    { type: 'toggle', label: 'Full screen', desc: 'F11 also switches it.', key: '_full', get: () => !!nb('isFullscreen'), set: v => nb('setFullscreen', v) },
    { type: 'action', label: 'Windows settings', value: () => '', run: () => nb('openSettings', 'system') },
    { type: 'info', label: 'Version', value: () => 'NSXL for Windows ' + (nb('version') || '') },
  ];

  // Controllers: read through the Gamepad API (standard mapping), only while NSXL has focus
  const MAP = { 0: 'a', 1: 'b', 2: 'x', 3: 'y', 4: 'l', 5: 'r', 8: 'minus', 9: 'plus', 12: 'up', 13: 'down', 14: 'left', 15: 'right', 16: 'home' };
  const famOf = id => /054c|dualsense|dualshock|playstation|wireless controller/i.test(id) ? 'ps' : /057e|pro controller|joy-con|nintendo/i.test(id) ? 'nintendo' : /xbox|xinput|045e/i.test(id) ? 'xbox' : 'generic';
  const held = {}, next = {};
  let lastId = '';
  const fire = (b, rep) => {
    if (b === 'home') { if (!rep && window.onHome) window.onHome(); return; }
    if (cfg.swapAB) b = { a: 'b', b: 'a', x: 'y', y: 'x' }[b] || b;
    window.onPad(b, rep);
  };
  (function poll() {
    requestAnimationFrame(poll);
    if (!document.hasFocus()) { for (const k in held) delete held[k]; return; }
    const pads = navigator.getGamepads ? [...navigator.getGamepads()].filter(Boolean) : [];
    const now = performance.now(), down = {};
    for (const p of pads) {
      p.buttons.forEach((bt, i) => { const b = MAP[i]; if (b && (bt.pressed || bt.value > .5)) down[b] = p; });
      const x = p.axes[0] || 0, y = p.axes[1] || 0;
      if (x < -.55) down.left = p; else if (x > .55) down.right = p;
      if (y < -.55) down.up = p; else if (y > .55) down.down = p;
    }
    for (const b in down) {
      const p = down[b];
      if (p.id !== lastId) { lastId = p.id; window.onPadKind(famOf(p.id)); }
      if (!held[b]) { held[b] = true; next[b] = now + 380; fire(b, false); }
      else if (/^(up|down|left|right)$/.test(b) && now >= next[b]) { next[b] = now + 85; fire(b, true); }
    }
    for (const b in held) if (!down[b]) delete held[b];
  })();
  window.addEventListener('gamepadconnected', updateStatus);
  window.addEventListener('gamepaddisconnected', updateStatus);
}

function boot() {
  $('#padInd .padIcon').innerHTML = svg('pad');
  onPress($('#avatar'), () => {
    const was = Hm.zone === 'user' && $('#avatar').classList.contains('sel');
    Hm.zone = 'user'; refreshSel();
    if (cfg.oneTap || was) { Snd.select(); retrigger($('#avatar'), 'wiggle'); setTimeout(openUserPage, 220); } else { Snd.tick(); buzz(); }
  });
  loadApps();
  DOCK = DOCK_ALL.filter(d => d.id !== 'ent' || cfg.entTab); renderDock();
  renderRow();
  applyTheme();
  nb('setSwapAB', cfg.swapAB); nb('setImmersive', cfg.immersive); nb('setOrientation', cfg.orientation); nb('setShortcut', cfg.shortcut);
  setAvatar();
  updateStatus();
  cloudSnap();
  try { const p = nb('cloudPending'); if (p) window.onCloudRestore(JSON.parse(p)); } catch (e) {}
  setInterval(updateClock, 1000);
  setInterval(updateStatus, 15000);
  let lastSL = 0, tilt = 0, tiltRaf = 0;
  const tiltLoop = () => {
    tilt *= 0.86; const row = $('#row');
    if (Math.abs(tilt) > 0.05 && !cfg.calm) { row.style.transform = `skewX(${(-tilt).toFixed(2)}deg)`; tiltRaf = requestAnimationFrame(tiltLoop); }
    else { row.style.transform = ''; tiltRaf = 0; }
  };
  $('#rowWrap').addEventListener('scroll', () => {
    const w = $('#rowWrap'), d = w.scrollLeft - lastSL; lastSL = w.scrollLeft;
    tilt = clamp(tilt + d * 0.035, -3.5, 3.5); if (!tiltRaf) tiltRaf = requestAnimationFrame(tiltLoop);
    requestAnimationFrame(positionTitle);
  }, { passive: true });
  window.addEventListener('resize', () => { refreshSel(); ensureRowVisible(false); fitTitle(); });
  if (document.fonts) document.fonts.ready.then(() => { refreshSel(); fitTitle(); });
  const firstStart = NATIVE ? !!nb('firstLoad') : true;
  const startHome = () => {
    document.body.classList.add('intro');
    setTimeout(() => document.body.classList.remove('intro'), 1400);
    Music.start();
  };
  requestAnimationFrame(() => { document.body.classList.add('ready'); refreshSel(); });
  if (firstStart && cfg.bootAnim && !cfg.calm) playBoot(startHome);
  else { startHome(); setTimeout(() => nb('pageReady'), 40); }

  if (NATIVE && !store.get('askedHome') && !nb('isDefaultHome')) {
    setTimeout(() => openDialog('Make this your Home screen?',
      'Pick NSXL as your Home app so the Home button always brings you here.',
      [{ label: 'Not now', cancel: true, run: () => store.set('askedHome', true) },
       { label: 'Set as Home', primary: true, run: () => { store.set('askedHome', true); nb('openSettings', 'home'); } }]), 900);
  }
}
boot();
})();
