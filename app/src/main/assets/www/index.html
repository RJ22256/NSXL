<!DOCTYPE html>
<html lang="en" data-theme="white">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>NSXL</title>
<script>
/* Apply the saved theme before first paint so there is no flash. */
(function () {
  try {
    var c = JSON.parse(localStorage.getItem('ch.cfg') || '{}');
    var t = c.theme || 'white';
    if (t === 'video' && window.Android && !Android.hasVideo()) t = 'black';
    document.documentElement.setAttribute('data-theme', t);
    if (c.scale) document.documentElement.style.setProperty('--scale', c.scale);
  } catch (e) {}
})();
</script>
<style>
@property --a { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
@font-face { font-family: "Montserrat"; src: url("fonts/Montserrat.ttf") format("truetype"); font-weight: 100 900; font-style: normal; font-display: swap; }

:root {
  --scale: 1;
  --u: calc(min(1vw, 1.7778vh) * var(--scale));   /* 1% of a 16:9 stage, times the Interface size setting */
  --H: calc(var(--u) * 56.25);
  --oy: calc((100vh - var(--H)) / 2);    /* vertical offset of the stage */
  --tile: calc(var(--u) * 20);
  --gap: calc(var(--u) * 1.25);
  --side: calc(var(--u) * 8.3);
  --r: calc(var(--u) * 1);
  --font: "Montserrat", "Roboto", "Noto Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --ring: conic-gradient(from var(--a), #3ec5ff 0deg, #4d7dff 70deg, #9b7bff 130deg, #4d7dff 190deg, #3ec5ff 250deg, #c9f4ff 292deg, #ffffff 310deg, #b5efff 328deg, #3ec5ff 360deg);
  --glow: rgba(110, 140, 255, .32);
}
html[data-theme=white] {
  --bg:#ebebeb; --ovBg:#ebebeb; --fg:#232323; --fg2:#5e5e5e; --accent:#1f5fd6;
  --slot:#f7f7f7; --pill:#f6f6f6; --pillLine:transparent; --selBg:#ffffff; --gapRing:#ffffff;
  --panel:#fbfbfb; --line:#dadada; --grey:#7f7f7f; --shadow:rgba(0,0,0,.12); --btn:#3a3a3a; --btnFg:#fff;
  --c-orange:#e8902a; --c-green:#3f9f45; --c-red:#de3434; --c-blue:#3a76cf; --c-teal:#2aa3b1;
}
html[data-theme=black] {
  --bg:#000000; --ovBg:#000000; --fg:#f0f0f0; --fg2:#a6a6a6; --accent:#3fcfff;
  --slot:#151515; --pill:#121212; --pillLine:#1f1f1f; --selBg:#262626; --gapRing:#000;
  --panel:#1b1b1b; --line:#2c2c2c; --grey:#a0a0a0; --shadow:rgba(0,0,0,.7); --btn:#e8e8e8; --btnFg:#000;
  --c-orange:#f3a03c; --c-green:#55c25b; --c-red:#ff5757; --c-blue:#5b9bff; --c-teal:#39c6d3;
}
html[data-theme=video] {
  --bg:transparent; --ovBg:rgba(8,8,12,.86); --fg:#ffffff; --fg2:rgba(255,255,255,.8); --accent:#86e3ff;
  --slot:rgba(255,255,255,.13); --pill:rgba(12,12,18,.45); --pillLine:rgba(255,255,255,.12);
  --selBg:rgba(255,255,255,.22); --gapRing:rgba(255,255,255,.92);
  --panel:rgba(30,30,36,.97); --line:rgba(255,255,255,.15); --grey:#e4e4e4; --shadow:rgba(0,0,0,.45);
  --btn:#fff; --btnFg:#000;
  --c-orange:#ffb257; --c-green:#72d978; --c-red:#ff6b6b; --c-blue:#86b5ff; --c-teal:#62dde8;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; height: 100%; overflow: hidden;
  background: var(--bg); color: var(--fg); font-family: var(--font);
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
}
body { opacity: 0; transition: opacity .25s; }
body.ready { opacity: 1; }
svg { display: block; }
.ic { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- live wallpaper helpers ---------- */
#fakeVideo {   /* only used in the browser preview, the app plays your real video behind the page */
  position: fixed; inset: 0; display: none;
  background:
    radial-gradient(circle at 20% 30%, #ff5f6d 0, transparent 38%),
    radial-gradient(circle at 80% 25%, #4facfe 0, transparent 42%),
    radial-gradient(circle at 55% 85%, #a18cd1 0, transparent 42%),
    linear-gradient(135deg, #1e1b4b, #0b1020);
  background-size: 200% 200%;
  animation: fv 16s ease-in-out infinite alternate;
}
@keyframes fv { from { background-position: 0% 0%; } to { background-position: 100% 100%; } }
#dim { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; }
html[data-theme=video] #dim { opacity: var(--dim, .25); }
html[data-theme=video] #top, html[data-theme=video] #foot,
html[data-theme=video] #gameTitle, html[data-theme=video] #dockLabel { text-shadow: 0 1px 4px rgba(0,0,0,.55); }

/* ---------- header ---------- */
#top {
  position: fixed; z-index: 30; left: 0; right: 0;
  top: calc(var(--u) * 3.6); height: calc(var(--u) * 5);
  padding: 0 max(calc(var(--u) * 4), env(safe-area-inset-right)) 0 max(calc(var(--u) * 4), env(safe-area-inset-left));
  display: flex; align-items: center; justify-content: space-between; pointer-events: none;
}
#top > * { pointer-events: auto; }
#avatar {
  width: calc(var(--u) * 4.4); height: calc(var(--u) * 4.4); border-radius: 50%;
  background: var(--selBg); position: relative; overflow: hidden;
  box-shadow: 0 0 0 calc(var(--u) * .28) var(--gapRing), 0 calc(var(--u) * .3) calc(var(--u) * .9) var(--shadow);
  transition: opacity .2s;
}
#avatarDefault { position: absolute; inset: 0; display: grid; place-items: center; color: var(--grey); }
#avatarDefault svg { width: 66%; height: 66%; }
#avatarImg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; }
#avatarImg.ok { display: block; }
body.full #avatar { opacity: 0; pointer-events: none; }
body.full #home { visibility: hidden; }
#status { display: flex; align-items: center; gap: calc(var(--u) * 1.4); color: var(--fg); }
#clock { font-size: calc(var(--u) * 2.75); font-weight: 500; letter-spacing: .02em; display: flex; align-items: baseline; }
#ampm { font-size: calc(var(--u) * 1.3); font-weight: 600; margin-left: calc(var(--u) * .3); }
#net svg { width: calc(var(--u) * 2.5); height: calc(var(--u) * 2.5); }
#bat svg { width: calc(var(--u) * 3.6); height: calc(var(--u) * 1.8); }
#bat .lvl { fill: var(--fg); }
#bat.low .lvl { fill: #ff4b4b; }
#bat.chg { color: #2fbf4f; }
#bat.chg .lvl { fill: #2fbf4f; }
#bat .bolt { fill: #fff; }
#batPct { font-size: calc(var(--u) * 2.2); font-weight: 500; margin-right: calc(var(--u) * -.5); }
#batPct:empty { display: none; }

/* ---------- home: tile row ---------- */
#home { position: fixed; inset: 0; }
#home.enter { animation: enter .32s cubic-bezier(.2,.8,.2,1); }
@keyframes enter { from { opacity: 0; transform: scale(1.025); } to { opacity: 1; transform: none; } }
#gameTitle {
  position: absolute; left: 0; top: calc(var(--oy) + var(--u) * 11.9);
  display: flex; align-items: center; gap: calc(var(--u) * .7);
  font-size: calc(var(--u) * 1.85); font-weight: 500; color: var(--accent); line-height: 1.3;
  white-space: nowrap; opacity: 0; transition: opacity .12s; pointer-events: none;
}
#gameTitle .tIcon { flex: 0 0 auto; width: calc(var(--u) * 1.25); height: calc(var(--u) * 1.6); border-radius: calc(var(--u) * .22); background: var(--accent); position: relative; }
#gameTitle .tIcon::after { content: ''; position: absolute; left: 22%; right: 22%; bottom: 14%; height: 12%; border-radius: 2px; background: rgba(255,255,255,.75); }
#gameTitle .tClip { flex: 1; min-width: 0; overflow: hidden; }
#gameTitle span { display: inline-block; white-space: nowrap; }
#gameTitle.marquee .tClip { -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 3%, #000 93%, transparent 100%); mask-image: linear-gradient(90deg, transparent 0, #000 3%, #000 93%, transparent 100%); }
#gameTitle.marquee span { animation: marquee var(--dur, 6s) ease-in-out infinite alternate; }
@keyframes marquee { 0%, 18% { transform: translateX(0); } 82%, 100% { transform: translateX(var(--shift, 0px)); } }
#rowWrap {
  position: absolute; left: 0; right: 0; top: calc(var(--oy) + var(--u) * 13.5);
  height: calc(var(--tile) + var(--u) * 4);
  overflow-x: auto; overflow-y: hidden; scrollbar-width: none; -webkit-overflow-scrolling: touch;
}
#rowWrap::-webkit-scrollbar { display: none; }
#row { display: flex; gap: var(--gap); padding: calc(var(--u) * 2) var(--side); width: max-content; }
.tile {
  position: relative; flex: 0 0 var(--tile); width: var(--tile); height: var(--tile);
  border-radius: var(--r); background: var(--slot); isolation: isolate; cursor: pointer;
}
.tile img, .cell .art img {
  position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
  border-radius: inherit; display: block; pointer-events: none;
}
.fb { position: absolute; inset: 0; border-radius: inherit; display: grid; place-items: center;
      color: #fff; font-weight: 700; font-size: calc(var(--u) * 6); }
.cell .fb { font-size: calc(var(--u) * 4); }
.tile.slot { cursor: default; }
.tile.more {
  --rr: 50%; flex: 0 0 calc(var(--u) * 7.4); width: calc(var(--u) * 7.4); height: calc(var(--u) * 7.4);
  align-self: center; margin-left: calc(var(--u) * 1.2); border-radius: 50%;
  display: grid; place-items: center; color: var(--grey); background: var(--slot);
  box-shadow: 0 calc(var(--u) * .2) calc(var(--u) * .8) var(--shadow);
}
.tile.more svg { width: calc(var(--u) * 3.2); height: calc(var(--u) * 3.2); }
.tile.more.sel { box-shadow: 0 0 0 calc(var(--u) * .2) var(--gapRing); }
.tile.sel, .dk.sel, .cell .art.sel, .tprev.sel { animation: selPop .3s cubic-bezier(.3,1.7,.5,1); }
@keyframes selPop { 0% { transform: scale(.975); } 100% { transform: scale(1); } }
.tile.pop { animation: pop .28s ease; }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(.95); } 100% { transform: scale(1); } }
.nudgeL { animation: nudgeL .22s ease; } .nudgeR { animation: nudgeR .22s ease; }
@keyframes nudgeL { 50% { transform: translateX(calc(var(--u) * -.7)); } }
@keyframes nudgeR { 50% { transform: translateX(calc(var(--u) * .7)); } }

/* ---------- Switch-style motion ---------- */
body.intro #top { animation: fadeDown .55s cubic-bezier(.2,.8,.2,1) both; }
body.intro #row .tile { animation: tileIn .6s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i, 0) * 55ms + 90ms); }
body.intro #dock { animation: rise .6s cubic-bezier(.2,.8,.2,1) .28s both; }
body.intro #foot { animation: fadeUp .5s .4s both; }
@keyframes tileIn { from { opacity: 0; transform: translateX(calc(var(--u) * 7)) scale(.94); } to { opacity: 1; transform: none; } }
@keyframes rise { from { opacity: 0; transform: translateY(calc(var(--u) * 3)) scale(.97); } to { opacity: 1; transform: none; } }
@keyframes fadeDown { from { opacity: 0; transform: translateY(calc(var(--u) * -1.5)); } to { opacity: 1; transform: none; } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(calc(var(--u) * 1.5)); } to { opacity: 1; transform: none; } }
body.leaving #home, body.leaving .ov { animation: leave .28s cubic-bezier(.5,0,.9,.5) both; }
body.leaving #top, body.leaving #foot { animation: fadeOut .2s both; }
@keyframes leave { to { opacity: 0; transform: scale(1.07); } }
@keyframes fadeOut { to { opacity: 0; } }
.tile.launching, .art.launching { z-index: 3; animation: launchTile .28s cubic-bezier(.5,0,.9,.5) both; }
@keyframes launchTile { 40% { transform: scale(.96); } 100% { transform: scale(1.14); } }
.ov.full.show .cell { animation: cellIn .42s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(min(var(--i, 0), 20) * 16ms); }
@keyframes cellIn { from { opacity: 0; transform: translateY(calc(var(--u) * 2)) scale(.96); } to { opacity: 1; transform: none; } }
.hint:active { transform: scale(.94); }
.dk:active, .tile:active { transform: scale(.96); }

/* small motions everywhere */
html, body, #avatar, #dock, .tile.slot, .ov.full, .menu, .dialog, .field, .dbtn, .tabs .t { transition: background-color .45s, color .45s, border-color .45s, box-shadow .2s; }
.swap { animation: swapIn .26s cubic-bezier(.2,.8,.2,1); }
@keyframes swapIn { from { opacity: 0; transform: translateY(calc(var(--u) * .7)); } to { opacity: 1; transform: none; } }
#gameTitle.swap { animation: titleIn .3s cubic-bezier(.2,.8,.2,1); }
@keyframes titleIn { from { opacity: 0; clip-path: inset(0 100% 0 0); } to { opacity: 1; clip-path: inset(0 0 0 0); } }
#dockLabel span.swap { animation: labelIn .26s cubic-bezier(.2,.8,.2,1); }
@keyframes labelIn { from { opacity: 0; transform: translate(-50%, calc(var(--u) * -.8)); } to { opacity: 1; transform: translate(-50%, 0); } }
#hm.swap { animation: tickIn .4s cubic-bezier(.2,.8,.2,1); display: inline-block; }
@keyframes tickIn { from { opacity: 0; transform: translateY(calc(var(--u) * -.8)); } to { opacity: 1; transform: none; } }
.press { animation: press .22s ease !important; }
@keyframes press { 40% { transform: scale(.93); } 100% { transform: scale(1); } }
.dk.sel svg { animation: bob 1.8s ease-in-out infinite; }
@keyframes bob { 50% { transform: scale(1.09); } }
#bat.chg .bolt { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
#padInd.on .leds i:first-child { animation: led 2.4s ease-in-out infinite; }
@keyframes led { 50% { box-shadow: 0 0 calc(var(--u) * .6) #3bd16f; } }
.tile.slot { background-image: linear-gradient(110deg, transparent 30%, rgba(255,255,255,.35) 50%, transparent 70%); background-size: 250% 100%; animation: shimmer 4.5s ease-in-out infinite; }
html[data-theme=black] .tile.slot, html[data-theme=video] .tile.slot { background-image: linear-gradient(110deg, transparent 30%, rgba(255,255,255,.05) 50%, transparent 70%); }
@keyframes shimmer { 0%, 30% { background-position: 120% 0; } 100% { background-position: -120% 0; } }
body.intro #row .tile.slot { animation: tileIn .6s cubic-bezier(.2,.8,.2,1) both, shimmer 4.5s ease-in-out infinite; animation-delay: calc(var(--i, 0) * 55ms + 90ms), 1s; }
body.intro #avatar { animation: popIn .5s cubic-bezier(.3,1.6,.5,1) .1s both; }
#avatar:active { transform: scale(.92); }
@keyframes popIn { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: none; } }
body.intro .dk { animation: popIn .45s cubic-bezier(.3,1.6,.5,1) both; animation-delay: calc(var(--i, 0) * 35ms + 380ms); }
.ov.show .menuItem, .ov.show .dbtn { animation: itemIn .32s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i, 0) * 32ms + 40ms); }
.setRow, .navItem { animation: itemIn .32s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i, 0) * 30ms); }
@keyframes itemIn { from { opacity: 0; transform: translateX(calc(var(--u) * 1.6)); } to { opacity: 1; transform: none; } }
.ov.full.show .ovTitle { animation: titleSlide .4s cubic-bezier(.2,.8,.2,1) both; }
@keyframes titleSlide { from { opacity: 0; transform: translateX(calc(var(--u) * -2)); } to { opacity: 1; transform: none; } }
.ov.full.show .tabs { animation: fadeDown .4s .08s both; }
#hints.swap .hint { animation: swapIn .28s cubic-bezier(.2,.8,.2,1) both; }
#hints.swap .hint:nth-child(2) { animation-delay: .04s; } #hints.swap .hint:nth-child(3) { animation-delay: .08s; }
img.flip { animation: flip .5s cubic-bezier(.2,.8,.2,1); }
@keyframes flip { from { transform: perspective(600px) rotateY(80deg); opacity: 0; } to { transform: none; opacity: 1; } }
.sw i { transition: transform .32s cubic-bezier(.3,1.6,.5,1); }
.tcard .tprev { transition: transform .2s; }
.tcard.cur .tprev { animation: selPop .35s cubic-bezier(.3,1.7,.5,1); }
.tcard.cur .check { animation: popIn .35s cubic-bezier(.3,1.6,.5,1); }
.bar i { transition: width .25s cubic-bezier(.2,.8,.2,1); }
.tabs .t { transition: background-color .25s, color .25s, transform .25s; }
.tabs .t.on { animation: selPop .3s cubic-bezier(.3,1.7,.5,1); }
#toast.show { animation: toastIn .38s cubic-bezier(.3,1.5,.5,1); }
@keyframes toastIn { from { transform: translate(-50%, calc(var(--u) * 3)) scale(.9); } to { transform: translate(-50%, 0); } }
.empty { animation: swapIn .4s both; }
#themeWipe { position: fixed; z-index: 50; pointer-events: none; border-radius: 50%; width: 10px; height: 10px; transform: translate(-50%, -50%) scale(0); animation: wipe .6s cubic-bezier(.4,0,.2,1) forwards; }
@keyframes wipe { 60% { opacity: .9; } to { transform: translate(-50%, -50%) scale(400); opacity: 0; } }

/* ---- even more motion ---- */
/* art lives in a clipping layer so it can drift without spilling out */
.clip { position: absolute; inset: 0; border-radius: inherit; overflow: hidden; }
.sel > .clip img { animation: kenburns 10s ease-in-out infinite alternate; }
@keyframes kenburns { from { transform: scale(1); } to { transform: scale(1.08) translate(-1.5%, -1%); } }
/* selected tile lifts a little */
.tile { transition: transform .28s cubic-bezier(.2,.8,.2,1), box-shadow .28s; }
.tile.g.sel:not(.more) { transform: translateY(calc(var(--u) * -.35)); animation: tileSel .32s cubic-bezier(.3,1.6,.5,1);
  box-shadow: 0 0 0 calc(var(--u) * .2) var(--gapRing), 0 calc(var(--u) * 1.1) calc(var(--u) * 2) calc(var(--u) * -.6) rgba(0,0,0,.28); }
@keyframes tileSel { 0% { transform: translateY(0) scale(.975); } 100% { transform: translateY(calc(var(--u) * -.35)); } }
/* dock icon hops when selected, then breathes */
.dk.sel svg { animation: hop .45s cubic-bezier(.3,1.6,.5,1), bob 1.8s .45s ease-in-out infinite; }
@keyframes hop { 40% { transform: translateY(calc(var(--u) * -.55)) scale(1.12); } 100% { transform: none; } }
/* touch ripple */
.rip { position: absolute; inset: 0; border-radius: inherit; overflow: hidden; pointer-events: none; z-index: 5; }
.rip i { position: absolute; border-radius: 50%; transform: translate(-50%, -50%) scale(0);
  background: radial-gradient(circle, rgba(120,160,255,.42), rgba(120,160,255,0) 70%); animation: rip .6s ease-out forwards; }
@keyframes rip { to { transform: translate(-50%, -50%) scale(1); opacity: 0; } }
/* drifting background glow */
#bgfx { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
#bgfx i { position: absolute; width: 60vmax; height: 60vmax; border-radius: 50%; animation: drift 26s ease-in-out infinite alternate; }
#bgfx i:nth-child(1) { left: -20vmax; top: -25vmax; background: radial-gradient(circle, var(--blob1), transparent 65%); }
#bgfx i:nth-child(2) { right: -22vmax; top: 10vh; background: radial-gradient(circle, var(--blob2), transparent 65%); animation-delay: -9s; animation-duration: 31s; }
#bgfx i:nth-child(3) { left: 20vw; bottom: -35vmax; background: radial-gradient(circle, var(--blob3), transparent 65%); animation-delay: -17s; animation-duration: 35s; }
@keyframes drift { 0% { transform: translate(0, 0) scale(1); } 50% { transform: translate(8vw, 5vh) scale(1.15); } 100% { transform: translate(-4vw, 9vh) scale(.95); } }
html[data-theme=white] { --blob1: rgba(150,185,255,.38); --blob2: rgba(230,180,255,.32); --blob3: rgba(160,230,255,.34); --flash: #ffffff; }
html[data-theme=black] { --blob1: rgba(30,70,170,.32); --blob2: rgba(110,40,150,.26); --blob3: rgba(10,110,130,.26); --flash: #000000; }
html[data-theme=video] #bgfx, html.nobg #bgfx { display: none; }
html[data-theme=video] { --flash: #000000; }
/* clock colon breathes */
#hm .col { animation: colon 2s ease-in-out infinite; padding: 0 .03em; }
@keyframes colon { 50% { opacity: .3; } }
/* launch: screen flashes to the theme colour like the console */
body.leaving::after { content: ''; position: fixed; inset: 0; z-index: 60; background: var(--flash, #fff); animation: flashIn .3s .06s both; pointer-events: none; }
@keyframes flashIn { from { opacity: 0; } to { opacity: 1; } }
/* sliding category marker in settings */
.navBar { position: absolute; left: calc(var(--u) * -.6); width: calc(var(--u) * .3); border-radius: 2px; background: var(--accent);
  transition: top .32s cubic-bezier(.3,1.4,.5,1), height .32s; }
/* wifi bars and battery wake up */
#net svg path, #net svg circle { animation: barIn .5s both; }
#net svg path:nth-of-type(2) { animation-delay: .08s; } #net svg path:nth-of-type(1) { animation-delay: .16s; }
@keyframes barIn { from { opacity: 0; transform: translateY(2px); } }
#avatar { animation: breatheShadow 4s ease-in-out infinite; }
@keyframes breatheShadow { 50% { box-shadow: 0 0 0 calc(var(--u) * .28) var(--gapRing), 0 calc(var(--u) * .5) calc(var(--u) * 1.4) var(--shadow); } }
/* neighbours ease apart from the selected tile */
.tile.nbL { transform: translateX(calc(var(--u) * -.35)); }
.tile.nbR { transform: translateX(calc(var(--u) * .35)); }
/* title card icon pops in */
#gameTitle.swap .tIcon { animation: popIn .35s cubic-bezier(.3,1.7,.5,1) both; }
/* menus spring open from where you are */
.ov.back .menu, .ov.back .dialog { transition: transform .34s cubic-bezier(.3,1.5,.5,1), opacity .2s; transform: scale(.88) translateY(calc(var(--u) * 1.5)); }
.ov.back.show .menu, .ov.back.show .dialog { transform: none; }
/* charging: the battery fills and empties */
#bat.chg .lvl { animation: charge 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: left center; }
@keyframes charge { 0% { transform: scaleX(.35); } 70%, 100% { transform: scaleX(1); } }
/* toggles squish */
.sw.on i { animation: squish .32s ease; }

<script>
(() => {
'use strict';

/* =========================================================
   Basics
   ========================================================= */
const NATIVE = typeof window.Android !== 'undefined';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const hash = s => { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return Math.abs(h); };

const store = {
  get(k, d) { try { const v = localStorage.getItem('ch.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('ch.' + k, JSON.stringify(v)); } catch (e) {} },
};
const DEFAULTS = { theme: 'white', dim: 0.25, blur: 0, clock: 'system', batPct: true, sounds: true, haptics: true,
                   swapAB: false, orientation: 'landscape', immersive: true, oneTap: false, calm: false, bgfx: true, scale: 1, tmdbKey: '', region: 'auto',
                   music: true, musicVol: 0.5, musicSrc: 'builtin', sgdbKey: '' };
const cfg = Object.assign({}, DEFAULTS, store.get('cfg', {}));
const saveCfg = () => store.set('cfg', cfg);
if (!store.get('mig.twoTap')) { cfg.oneTap = false; saveCfg(); store.set('mig.twoTap', true); }  // new default: tap to select, tap again to start

/* =========================================================
   Icons (original line icons, 24x24)
   ========================================================= */
function gearShape() {
  const N = 8, R1 = 9, R2 = 6.9; let d = '';
  for (let i = 0; i < N; i++) {
    const a0 = (i / N) * Math.PI * 2, w = Math.PI / N;
    [[R2, a0 - w * .62], [R1, a0 - w * .34], [R1, a0 + w * .34], [R2, a0 + w * .62]].forEach(([r, a], j) => {
      d += (i === 0 && j === 0 ? 'M' : 'L') + (12 + r * Math.cos(a)).toFixed(2) + ' ' + (12 + r * Math.sin(a)).toFixed(2) + ' ';
    });
  }
  return `<path d="${d}Z"/><circle cx="12" cy="12" r="2.9"/>`;
}
const ICONS = {
  grid:   '<rect x="4" y="4" width="7" height="7" rx="1.7"/><rect x="13" y="4" width="7" height="7" rx="1.7"/><rect x="4" y="13" width="7" height="7" rx="1.7"/><rect x="13" y="13" width="7" height="7" rx="1.7"/>',
  chat:   '<path d="M6 4.8h12a3 3 0 0 1 3 3v6.4a3 3 0 0 1-3 3h-6.3l-4.6 3.4v-3.4H6a3 3 0 0 1-3-3V7.8a3 3 0 0 1 3-3z"/><path d="M8 11h.01M12 11h.01M16 11h.01" stroke-width="2.4"/>',
  news:   '<rect x="4.5" y="3.5" width="15" height="17" rx="2.6"/><path d="M8 8.4h8M8 12h8M8 15.6h4.6"/>',
  bag:    '<path d="M5.2 8.5h13.6l-1.1 10.4a2 2 0 0 1-2 1.8H8.3a2 2 0 0 1-2-1.8z"/><path d="M9 8.5V7a3 3 0 0 1 6 0v1.5"/>',
  album:  '<rect x="3.5" y="5" width="17" height="14" rx="2.6"/><path d="M3.9 16.4l4.6-4.5 3.8 3.6 2.6-2.4 5.2 4.5"/><circle cx="15.8" cy="9.3" r="1.4"/>',
  music:  '<path d="M9 17.4V6.3l10-2.1v11"/><circle cx="6.6" cy="17.6" r="2.4"/><circle cx="16.6" cy="15.2" r="2.4"/>',
  pad:    '<path d="M7.5 7h9a5 5 0 0 1 4.8 6.4l-.9 3a2.3 2.3 0 0 1-3.9.9L14.8 15H9.2l-1.7 2.3a2.3 2.3 0 0 1-3.9-.9l-.9-3A5 5 0 0 1 7.5 7z"/><path d="M8 9.7v3.1M6.45 11.25h3.1"/><circle cx="15.6" cy="10.3" r=".55"/><circle cx="17.5" cy="12.2" r=".55"/>',
  display:'<rect x="6.5" y="3" width="11" height="18" rx="2.3"/><path d="M10.5 17.8h3"/>',
  gear:   gearShape(),
  power:  '<path d="M12 3.6v7.6"/><path d="M7.1 6.6a7.4 7.4 0 1 0 9.8 0"/>',
  home:   '<path d="M4.5 11 12 4.6l7.5 6.4v8a1 1 0 0 1-1 1h-4.2v-5.4H9.7V20H5.5a1 1 0 0 1-1-1z"/>',
  check:  '<path d="M5 12.6l4.4 4.4L19 7.4"/>',
  film:   '<rect x="3.5" y="5" width="17" height="14" rx="2.6"/><path d="M10.2 9.3v5.4l4.5-2.7z" fill="currentColor"/>',
  person: '<circle cx="12" cy="9.2" r="3.7"/><path d="M5 20a7 7 0 0 1 14 0"/>',
};
const svg = (name, cls = 'ic') => `<svg viewBox="0 0 24 24" class="${cls}">${ICONS[name]}</svg>`;

function wifiSvg(bars, on) {
  const o = i => (on && bars >= i) ? 1 : .28;
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round">
    <path d="M2.8 9.4a13.4 13.4 0 0 1 18.4 0" opacity="${o(3)}"/>
    <path d="M6 12.8a8.9 8.9 0 0 1 12 0" opacity="${o(2)}"/>
    <path d="M9.2 16.1a4.4 4.4 0 0 1 5.6 0" opacity="${o(1)}"/>
    <circle cx="12" cy="19.3" r="1.45" fill="currentColor" stroke="none" opacity="${on ? 1 : .28}"/></svg>`;
}
function cellSvg(bars) {
  return `<svg viewBox="0 0 24 24" fill="currentColor">${[0, 1, 2, 3].map(i =>
    `<rect x="${3 + i * 5}" y="${17 - i * 3.6}" width="3.4" height="${3 + i * 3.6}" rx="1" opacity="${bars > i ? 1 : .28}"/>`).join('')}</svg>`;
}
function batterySvg(lvl, charging) {
  const w = Math.max(1.2, 18 * clamp(lvl, 0, 100) / 100).toFixed(2);
  return `<svg viewBox="0 0 28 14"><rect x="1" y="1.5" width="22.4" height="11" rx="2.8" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <rect x="24.4" y="4.8" width="2.2" height="4.4" rx="1.1" fill="currentColor"/>
    <rect x="3.2" y="3.7" width="${w}" height="6.6" rx="1.3" class="lvl"/>
    ${charging ? '<path class="bolt" d="M13.9 2.6 9.8 7.6h3.1l-1.5 3.9 4.3-5.2h-3.1z"/>' : ''}</svg>`;
}

function ensureRing(n) {
  if (!n.classList || !n.classList.contains('g')) return;
  for (const c of n.children) if (c.classList.contains('ring')) return;
  const r = document.createElement('i'); r.className = 'ring'; r.setAttribute('aria-hidden', 'true');
  r.appendChild(document.createElement('b')); n.appendChild(r);
}
new MutationObserver(list => list.forEach(m => { if (m.target.classList && m.target.classList.contains('sel')) ensureRing(m.target); }))
  .observe(document.documentElement, { subtree: true, attributes: true, attributeFilter: ['class'] });
const retrigger = (node, cls) => { if (!node) return; node.classList.remove(cls); void node.offsetWidth; node.classList.add(cls); };
const pressFx = node => retrigger(node, 'press');
function ripple(node, e) {
  if (cfg.calm) return;
  const r = node.getBoundingClientRect(), d = Math.max(r.width, r.height) * 2.4;
  const host = document.createElement('span'); host.className = 'rip';
  const dot = document.createElement('i');
  dot.style.cssText = `left:${e.clientX - r.left}px;top:${e.clientY - r.top}px;width:${d}px;height:${d}px`;
  host.appendChild(dot); node.appendChild(host); setTimeout(() => host.remove(), 650);
}

/* =========================================================
   Native bridge (or a mock for previewing in a browser)
   ========================================================= */
const B = NATIVE ? window.Android : makeMock();
function nb(name, ...args) {
  try { if (B && typeof B[name] === 'function') return B[name](...args); } catch (e) { console.warn('bridge', name, e); }
  return undefined;
}

/* =========================================================
   Sound + haptics (synthesised, no audio files)
   ========================================================= */
const Snd = {
  ctx: null,
  ensure() {
    try {
      if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (this.ctx.state === 'suspended') this.ctx.resume();
    } catch (e) {}
    return this.ctx;
  },
  unlock() {
    if (cfg.sounds || cfg.music) this.ensure();
    if (typeof Music !== 'undefined' && cfg.music && !Music.on && !Music.paused) Music.start();
  },
  tone(f1, f2, dur, gain, type = 'sine', delay = 0) {
    if (!cfg.sounds) return;
    const c = this.ensure(); if (!c) return;
    const t = c.currentTime + delay, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f1, t);
    if (f2 !== f1) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.03);
  },
  tick()   { this.tone(2300, 1500, 0.03, 0.05); },
  bump()   { this.tone(240, 180, 0.07, 0.08, 'triangle'); },
  select() { this.tone(988, 988, 0.05, 0.06); this.tone(1480, 1480, 0.08, 0.06, 'sine', 0.045); },
  back()   { this.tone(1180, 760, 0.07, 0.05); },
  launch() { [784, 1047, 1568].forEach((f, i) => this.tone(f, f, 0.1, 0.06, 'sine', i * 0.055)); },
};
const buzz = kind => { if (cfg.haptics) nb('haptic', kind || 'tick'); };

/* =========================================================
   Ambient music: generated on the fly (soft chords + bells),
   or your own music file. Pauses while a game is running.
   ========================================================= */
const hasMusic = () => !!nb('hasMusic');
const Music = {
  on: false, paused: false, waiting: false, bus: null, input: null, timer: 0, audio: null,
  CHORDS: [[53, 57, 60, 64, 67], [52, 55, 59, 62, 67], [50, 53, 57, 60, 64], [48, 55, 59, 62, 64]],
  BELLS: [72, 74, 76, 79, 81, 84, 86],
  hz: m => 440 * Math.pow(2, (m - 69) / 12),
  level: () => 0.24 * cfg.musicVol,
  start() {
    if (this.on || this.paused || !cfg.music) return;
    if (cfg.musicSrc === 'custom' && hasMusic()) return this.startFile();
    const c = Snd.ensure(); if (!c) return;
    if (c.state !== 'running') {
      if (!this.waiting) { this.waiting = true; c.resume().then(() => { this.waiting = false; this.start(); }).catch(() => { this.waiting = false; }); }
      return;
    }
    this.on = true;
    const bus = c.createGain(); bus.gain.setValueAtTime(0, c.currentTime); bus.gain.linearRampToValueAtTime(this.level(), c.currentTime + 4);
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1700; lp.Q.value = 0.3;
    const verb = c.createConvolver(); verb.buffer = this.impulse(c, 3.4);
    const wet = c.createGain(); wet.gain.value = 0.6;
    const dry = c.createGain(); dry.gain.value = 0.55;
    lp.connect(dry); lp.connect(verb); verb.connect(wet); dry.connect(bus); wet.connect(bus); bus.connect(c.destination);
    this.bus = bus; this.input = lp; this.step = 0; this.next = c.currentTime + 0.1; this.bellNext = c.currentTime + 2.5;
    this.tick();
  },
  impulse(c, secs) {
    const len = Math.floor(c.sampleRate * secs), buf = c.createBuffer(2, len, c.sampleRate);
    for (let ch = 0; ch < 2; ch++) { const d = buf.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.8); }
    return buf;
  },
  tick() {
    if (!this.on || !this.input) return;
    const c = Snd.ctx, ahead = c.currentTime + 1.6;
    while (this.next < ahead) { this.chord(this.CHORDS[this.step % this.CHORDS.length], this.next, 8); this.step++; this.next += 8; }
    while (this.bellNext < ahead) { this.bell(this.BELLS[Math.floor(Math.random() * this.BELLS.length)], this.bellNext); this.bellNext += 1.3 + Math.random() * 2.8; }
    this.timer = setTimeout(() => this.tick(), 500);
  },
  chord(notes, t, dur) {
    const c = Snd.ctx, input = this.input;
    notes.forEach((m, i) => [-5, 5].forEach(det => {
      const o = c.createOscillator(), g = c.createGain(), peak = i === 0 ? 0.14 : 0.06;
      o.type = i === 0 ? 'sine' : 'triangle'; o.frequency.value = this.hz(m); o.detune.value = det;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + 2.8);
      g.gain.setValueAtTime(peak, t + dur - 0.4); g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 2.6);
      o.connect(g); g.connect(input); o.start(t); o.stop(t + dur + 2.8);
    }));
  },
  bell(m, t) {
    const c = Snd.ctx, o = c.createOscillator(), o2 = c.createOscillator(), g = c.createGain(), g2 = c.createGain();
    o.frequency.value = this.hz(m); o2.frequency.value = this.hz(m) * 2.01; g2.gain.value = 0.22;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.05, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 2.6);
    o.connect(g); o2.connect(g2); g2.connect(g); g.connect(this.input);
    o.start(t); o2.start(t); o.stop(t + 2.7); o2.stop(t + 2.7);
  },
  startFile() {
    this.on = true;
    if (!this.audio) { this.audio = new Audio(); this.audio.loop = true; }
    const src = '/music?v=' + store.get('musicV', 0);
    if (!this.audio.src.endsWith(src)) this.audio.src = src;
    this.audio.volume = clamp(cfg.musicVol * 0.7, 0, 1);
    this.audio.play().catch(() => { this.on = false; });
  },
  stop() {
    this.on = false; clearTimeout(this.timer);
    if (this.audio) this.audio.pause();
    if (this.bus) {
      const b = this.bus, c = Snd.ctx;
      try { b.gain.cancelScheduledValues(c.currentTime); b.gain.setValueAtTime(b.gain.value, c.currentTime); b.gain.linearRampToValueAtTime(0, c.currentTime + 0.5); } catch (e) {}
      setTimeout(() => { try { b.disconnect(); } catch (e) {} }, 700);
      this.bus = null; this.input = null;
    }
  },
  setVol() {
    if (this.audio) this.audio.volume = clamp(cfg.musicVol * 0.7, 0, 1);
    if (this.bus) this.bus.gain.setTargetAtTime(this.level(), Snd.ctx.currentTime, 0.2);
  },
  restart() { this.stop(); if (this.audio) this.audio.removeAttribute('src'); if (cfg.music && !this.paused) setTimeout(() => this.start(), 600); },
  pause() { this.paused = true; this.stop(); },
  resume() { this.paused = false; if (cfg.music) this.start(); },
};
window.onMusicPicked = (ok, msg) => {
  if (ok) { store.set('musicV', Date.now()); cfg.musicSrc = 'custom'; cfg.music = true; saveCfg(); Music.restart(); showToast('Music set', 2200); refreshOverlays(); }
  else if (msg) showToast(msg, 2600); else hideToast();
};

/* =========================================================
   Async native calls (SteamGridDB) as promises
   ========================================================= */
const pending = {}; let reqN = 0;
function nbAsync(method, ...args) {
  return new Promise((resolve, reject) => {
    const id = 'r' + (++reqN); pending[id] = { resolve, reject };
    nb(method, id, ...args);
    setTimeout(() => { if (pending[id]) { delete pending[id]; reject('Timed out. Check your connection.'); } }, 45000);
  });
}
window.onAsync = (id, ok, data) => {
  const p = pending[id]; if (!p) return; delete pending[id];
  ok ? p.resolve(data) : p.reject(data);
};

/* =========================================================
   Apps
   ========================================================= */
let APPS = [], BY = {};
function loadApps() {
  let list = [];
  try { list = JSON.parse(nb('getApps') || '[]'); } catch (e) {}
  const names = store.get('names', {});
  list.forEach(a => { a.orig = a.label; if (names[a.pkg]) a.label = names[a.pkg]; });
  list.sort((a, b) => a.label.localeCompare(b.label, undefined, { sensitivity: 'base' }));
  APPS = list; BY = {};
  list.forEach(a => { BY[a.pkg] = a; });
}
function reloadApps() { loadApps(); renderRow(); refreshOverlays(); refreshSel(); }
function renameApp(pkg) {
  const a = BY[pkg]; if (!a) return;
  openPrompt('Rename', a.label, 'Name', v => {
    const n = store.get('names', {}); v = v.trim();
    if (!v || v === a.orig) delete n[pkg]; else n[pkg] = v;
    store.set('names', n); reloadApps(); toast('Renamed to ' + (v || a.orig));
  });
}
const isGameish = a => a.game || !!store.get('added', {})[a.pkg];

function homeList() {
  const added = store.get('added', {}), hidden = store.get('hidden', {}), played = store.get('played', {});
  const key = p => Math.max(played[p] || 0, added[p] || 0, (BY[p] && BY[p].installed) || 0);
  return APPS.filter(a => (a.game || added[a.pkg]) && !hidden[a.pkg]).map(a => a.pkg).sort((x, y) => key(y) - key(x));
}
function setOnHome(pkg, on) {
  const added = store.get('added', {}), hidden = store.get('hidden', {});
  if (on) { added[pkg] = Date.now(); delete hidden[pkg]; }
  else { delete added[pkg]; if (BY[pkg] && BY[pkg].game) hidden[pkg] = true; }
  store.set('added', added); store.set('hidden', hidden);
  renderRow(); refreshOverlays();
}

const coverVer = pkg => (store.get('coverV', {})[pkg] || 0);
function bumpCover(pkg) {
  const v = store.get('coverV', {}); v[pkg] = Date.now(); store.set('coverV', v);
  $$('img[data-pkg]').forEach(img => {
    if (img.dataset.pkg !== pkg) return;
    img.addEventListener('load', () => retrigger(img, 'flip'), { once: true });
    img.src = artUrl(pkg, +img.dataset.s);
  });
}
function artUrl(pkg, size) {
  return NATIVE ? `/art/${encodeURIComponent(pkg)}?s=${size}&v=${coverVer(pkg)}` : mockArt(pkg);
}
function artBox(pkg, size, box) {
  const a = BY[pkg] || { label: '?' };
  const hue = hash(pkg) % 360;
  const clip = el('div', 'clip'); box.appendChild(clip);
  const fb = el('div', 'fb', esc((a.label || '?').trim().charAt(0).toUpperCase()));
  fb.style.background = `linear-gradient(135deg, hsl(${hue},62%,56%), hsl(${(hue + 40) % 360},60%,42%))`;
  clip.appendChild(fb);
  const img = el('img'); img.alt = ''; img.decoding = 'async';
  img.dataset.pkg = pkg; img.dataset.s = size;
  img.onload = () => { fb.style.visibility = 'hidden'; };
  img.onerror = () => { img.style.visibility = 'hidden'; fb.style.visibility = 'visible'; };
  img.src = artUrl(pkg, size);
  clip.appendChild(img);
}

/* =========================================================
   Press helper: tap + long-press for touch
   ========================================================= */
function onPress(node, tap, long) {
  let timer = null, sx = 0, sy = 0, fired = false;
  const cancel = () => { if (timer) { clearTimeout(timer); timer = null; } };
  node.addEventListener('pointerdown', e => {
    fired = false; sx = e.clientX; sy = e.clientY; Snd.unlock();
    if (node.classList.contains('g') || node.classList.contains('tile')) ripple(node, e);
    if (long) timer = setTimeout(() => { timer = null; fired = true; buzz('long'); long(e); }, 480);
  });
  node.addEventListener('pointermove', e => { if (Math.abs(e.clientX - sx) > 12 || Math.abs(e.clientY - sy) > 12) cancel(); });
  node.addEventListener('pointerup', cancel);
  node.addEventListener('pointercancel', cancel);
  node.addEventListener('pointerleave', cancel);
  node.addEventListener('click', e => {
    if (fired) { fired = false; e.stopPropagation(); return; }
    if (tap) tap(e);
  });
  node.addEventListener('contextmenu', e => e.preventDefault());
}

/* =========================================================
   Home screen
   ========================================================= */
const MAX_HOME = 12;
const Hm = { items: [], idx: 0, zone: 'row', dockIdx: 0, launched: false, mode: 'games', saved: {} };

const DOCK = [
  { id: 'all',      label: 'All Software', icon: 'grid',    red: true, run: () => openAll({}) , fixed: true },

function updateTitle() {

function ensureRowVisible(smooth = true) {

function homePad(b) {
  if (Hm.zone === 'row') {
    switch (b) {
      case 'left': moveRow(-1); break;
      case 'right': moveRow(1); break;
      case 'down': Hm.zone = 'dock'; Snd.tick(); buzz(); refreshSel(); break;
      case 'up': Snd.bump(); break;
      case 'a': activateRow(Hm.idx); break;
      case 'plus': case 'x': rowOptions(); break;
      case 'l': setMode('games'); break;
      case 'r': setMode('ent'); break;
      case 'y': Snd.select(); openAll({}); break;
      case 'minus': Snd.select(); openSettings(); break;
      case 'b': if (Hm.idx) { Snd.back(); selectRow(0); } break;
    }
  } else {
    switch (b) {
      case 'left': if (Hm.dockIdx > 0) { Hm.dockIdx--; Snd.tick(); buzz(); refreshSel(); } else { Snd.bump(); nudge(dockEls[0], -1); } break;
      case 'right': if (Hm.dockIdx < DOCK.length - 1) { Hm.dockIdx++; Snd.tick(); buzz(); refreshSel(); } else { Snd.bump(); nudge(dockEls[DOCK.length - 1], 1); } break;
      case 'up': case 'b': if (Hm.items.length) { Hm.zone = 'row'; b === 'b' ? Snd.back() : Snd.tick(); buzz(); refreshSel(); ensureRowVisible(); } else Snd.bump(); break;
      case 'down': Snd.bump(); break;
      case 'a': runDock(Hm.dockIdx); break;
      case 'plus': case 'x': dockOptions(Hm.dockIdx); break;
      case 'y': Snd.select(); openAll({}); break;
      case 'minus': Snd.select(); openSettings(); break;
      case 'l': setMode('games'); break;
      case 'r': setMode('ent'); break;
    }
  }
}

/* =========================================================
   Overlay stack
   ========================================================= */
const stack = [];
const topOverlay = () => stack[stack.length - 1];
function pushOverlay(o) {
  document.body.appendChild(o.el);
  stack.push(o);
  requestAnimationFrame(() => o.el.classList.add('show'));
  syncFull(); refreshSel();
}
function popOverlay(silent) {
  const o = stack.pop(); if (!o) return;
  if (!silent) Snd.back();
  o.el.classList.remove('show');
  setTimeout(() => o.el.remove(), 200);
  if (o.onClose) o.onClose();
  syncFull(); refreshSel();
}
function closeAll() { while (stack.length) popOverlay(true); }
function syncFull() { document.body.classList.toggle('full', stack.some(o => o.full)); }
function refreshOverlays() { stack.forEach(o => o.refresh && o.refresh()); }

const BTN = { a: 'A', b: 'B', x: 'X', y: 'Y', plus: '+', minus: '−', l: 'L', r: 'R' };
function updateHints() {
  const top = topOverlay();
  const cur = Hm.items[Hm.idx];
  const list = top ? top.hints()
    : Hm.zone === 'dock' ? (DOCK[Hm.dockIdx].fixed ? [['a', 'OK']] : [['plus', 'Options'], ['a', 'OK']])
    : cur && cur.type === 'app' ? [['plus', 'Options'], ['a', 'Start']]
    : cur && cur.type === 'svc' ? [['plus', 'Options'], ['a', 'Browse']] : [['a', 'OK']];
  const box = $('#hints'), sig = list.map(x => x.join(':')).join('|');
  if (box.dataset.sig === sig) return;
  box.dataset.sig = sig; box.innerHTML = '';
  retrigger(box, 'swap');
  list.forEach(([btn, label]) => {
    const s = el('span', 'hint', `<i class="btn">${BTN[btn]}</i>${esc(label)}`);
    onPress(s, () => window.onPad(btn, false, true));
    box.appendChild(s);
  });
}

/* ---------- menu ---------- */
function openMenu(title, items) {
  items = items.filter(Boolean);
  const back = el('div', 'ov back'), m = el('div', 'menu');
  if (title) m.appendChild(el('div', 'menuTitle', esc(title)));
  let sel = 0;
  const paint = () => { els.forEach((e, i) => e.classList.toggle('sel', i === sel)); els[sel] && els[sel].scrollIntoView({ block: 'nearest' }); };
  const choose = () => { const it = items[sel]; if (!it) return; Snd.select(); popOverlay(true); it.run(); };
  const els = items.map((it, i) => {
    const e = el('div', 'menuItem g' + (it.danger ? ' danger' : ''), esc(it.label));
    e.style.setProperty('--i', i);
    onPress(e, () => { sel = i; paint(); choose(); });
    m.appendChild(e); return e;
  });
  back.appendChild(m);
  onPress(back, ev => { if (ev.target === back) popOverlay(); });
  pushOverlay({
    el: back,
    pad(b) {
      if (b === 'up') { if (sel > 0) { sel--; Snd.tick(); buzz(); paint(); } else Snd.bump(); }
      else if (b === 'down') { if (sel < els.length - 1) { sel++; Snd.tick(); buzz(); paint(); } else Snd.bump(); }
      else if (b === 'a') choose();
      else if (b === 'b' || b === 'plus') popOverlay();
    },
    hints: () => [['b', 'Back'], ['a', 'OK']],
  });
  paint();
}

/* ---------- dialog ---------- */
function openDialog(title, text, buttons) {
  const back = el('div', 'ov back'), d = el('div', 'dialog');
  d.innerHTML = `<h2>${esc(title)}</h2><p>${esc(text)}</p>`;
  const row = el('div', 'dbtns'); d.appendChild(row); back.appendChild(d);
  let sel = Math.max(0, buttons.findIndex(b => b.primary));
  const paint = () => els.forEach((e, i) => e.classList.toggle('sel', i === sel));
  const choose = () => { const bt = buttons[sel]; Snd.select(); popOverlay(true); bt.run && bt.run(); };
  const els = buttons.map((bt, i) => {
    const e = el('div', 'dbtn g' + (bt.primary ? ' primary' : ''), esc(bt.label));
    e.style.setProperty('--i', i);
    onPress(e, () => { sel = i; paint(); choose(); }); row.appendChild(e); return e;
  });
  pushOverlay({

      else if (b === 'right') { if (sel < els.length - 1) { sel++; Snd.tick(); paint(); } else Snd.bump(); }
      else if (b === 'a') choose();

/* ---------- text prompt ---------- */
function openPrompt(title, value, placeholder, onOk, noteHtml) {
  const back = el('div', 'ov back'), d = el('div', 'dialog');
  d.innerHTML = `<h2>${esc(title)}</h2>${noteHtml ? `<p>${noteHtml}</p>` : ''}
    <input class="field" type="text" spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="${esc(placeholder)}" placeholder="${esc(placeholder)}">`;
  const input = $('input', d); input.value = value || '';
  const row = el('div', 'dbtns'); d.appendChild(row); back.appendChild(d);
  let sel = 1;
  const done = ok => { popOverlay(ok); if (ok) { Snd.select(); onOk(input.value); } };
  const btns = [['Cancel', false], ['OK', true]].map(([l, ok], i) => {
    const e = el('div', 'dbtn g' + (ok ? ' primary' : ''), l);
    onPress(e, () => done(ok)); row.appendChild(e); return e;
  });
  const paint = () => btns.forEach((e, i) => e.classList.toggle('sel', i === sel));
  input.addEventListener('focus', () => nb('setTyping', true));
  input.addEventListener('blur', () => nb('setTyping', false));
  input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); done(true); } else if (e.key === 'Escape') { e.preventDefault(); done(false); } });
  pushOverlay({
    el: back,
    pad(b) {
      if (b === 'left' || b === 'right') { sel = b === 'left' ? 0 : 1; Snd.tick(); paint(); }
      else if (b === 'up') input.focus();
      else if (b === 'down') input.blur();
      else if (b === 'a') done(btns[sel] && sel === 1);
      else if (b === 'b') done(false);
    },
    hints: () => [['b', 'Cancel'], ['a', 'OK']],
    onClose: () => { input.blur(); nb('setTyping', false); },
  });
  paint();
  setTimeout(() => { input.focus(); input.select(); }, 260);
}

/* ---------- SteamGridDB cover art ---------- */
const SGDB_NOTE = 'Covers come from <b>SteamGridDB</b>. Make a free account at steamgriddb.com, then copy your API key from <b>Preferences › API</b> and paste it here.';
function needKey(then) {
  if (cfg.sgdbKey) return then();
  openPrompt('SteamGridDB API key', '', 'Paste your API key', v => {
    cfg.sgdbKey = v.trim(); saveCfg(); refreshOverlays();
    if (cfg.sgdbKey) then();
  }, SGDB_NOTE);
}
function sgdbError(e) {
  const msg = String(e || 'Something went wrong');
  if (/key|401|403/i.test(msg)) {
    openDialog('SteamGridDB key problem', msg + ' Check the key in Settings › Cover Art.', [{ label: 'OK', primary: true }]);
  } else showToast(msg, 3000);
}
function sgdbFind(pkg, term) {
  const a = BY[pkg]; if (!a) return;
  term = term || a.label;
  needKey(async () => {
    showToast('Searching SteamGridDB…', 15000);
    try {
      const games = await nbAsync('sgdbSearch', cfg.sgdbKey, term);
      hideToast();
      const searchOther = { label: 'Search a different name…', run: () => openPrompt('Search SteamGridDB', term, 'Game name', v => v.trim() && sgdbFind(pkg, v.trim())) };
      if (!games.length) { openMenu('No matches for “' + term + '”', [searchOther]); return; }
      openMenu('Which game is “' + a.label + '”?', games.slice(0, 8).map(g => ({
        label: g.name + (g.year ? '  (' + g.year + ')' : ''), run: () => sgdbPick(pkg, g),
      })).concat([searchOther]));
    } catch (e) { hideToast(); sgdbError(e); }
  });
}
async function sgdbPick(pkg, game) {
  showToast('Loading covers…', 15000);
  try {
    const grids = await nbAsync('sgdbGrids', cfg.sgdbKey, game.id);
    hideToast();
    if (!grids.length) { toast('No covers for ' + game.name + ' yet'); return; }
    openCoverPicker(pkg, game.name, grids);
  } catch (e) { hideToast(); sgdbError(e); }
}
async function sgdbApply(pkg, url) {
  showToast('Downloading cover…', 20000);
  try {
    await nbAsync('sgdbApply', pkg, url);
    if (BY[pkg]) BY[pkg].cover = true; bumpCover(pkg); showToast('Cover art updated', 2000);
  } catch (e) { hideToast(); sgdbError(e); }
}
function openCoverPicker(pkg, name, grids) {
  const ov = el('section', 'ov full');
  ov.innerHTML = `<div class="ovTitle">${svg('album')}<span>${esc(name)}</span></div><div class="ovRule"></div><div class="ovRule bottom"></div>
    <div class="tabs"><span class="t on">SteamGridDB covers</span></div><div class="grid"></div>`;
  const grid = $('.grid', ov);
  let sel = 0;
  const cells = grids.map((g, i) => {
    const c = el('div', 'cell'), art = el('div', 'art g');
    c.style.setProperty('--i', i);
    const img = el('img'); img.alt = ''; img.loading = 'lazy'; img.src = g.thumb || g.url; art.appendChild(img);
    if (g.width && g.height) art.appendChild(el('span', 'src', g.width + '×' + g.height));
    c.appendChild(art); c.appendChild(el('div', 'nm', esc(g.style ? g.style.replace(/_/g, ' ') : 'Cover ' + (i + 1))));
    onPress(c, () => { sel = i; paint(); act(); });
    grid.appendChild(c); return c;
  });
  const paint = () => { cells.forEach((c, i) => { c.classList.toggle('sel', i === sel); c.firstChild.classList.toggle('sel', i === sel); }); const c = cells[sel]; c && c.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); };
  const cols = () => { if (cells.length < 2) return 1; const t0 = cells[0].offsetTop; let n = 0; for (const c of cells) { if (c.offsetTop !== t0) break; n++; } return n; };
  const move = d => { const n = sel + d; if (n < 0 || n >= cells.length) { Snd.bump(); return; } sel = n; Snd.tick(); buzz(); paint(); };
  const act = () => { const g = grids[sel]; if (!g) return; Snd.select(); popOverlay(true); sgdbApply(pkg, g.url); };
  pushOverlay({
    el: ov, full: true,
    pad(b) {
      if (b === 'left') move(-1); else if (b === 'right') move(1);
      else if (b === 'up') move(-cols()); else if (b === 'down') move(cols());
      else if (b === 'a') act(); else if (b === 'b') popOverlay();
    },
    hints: () => [['b', 'Back'], ['a', 'Use this cover']],

const regionCode = () => (cfg.region && cfg.region !== 'auto' ? cfg.region : (nb('region') || 'GB')).toUpperCase();
async function tmdbGet(path, params) {
  const key = (cfg.tmdbKey || '').trim(), bearer = key.length > 40;
  const q = new URLSearchParams(params); if (!bearer) q.set('api_key', key);
  const r = await fetch('https://api.themoviedb.org/3' + path + '?' + q.toString(), { headers: bearer ? { Authorization: 'Bearer ' + key, accept: 'application/json' } : { accept: 'application/json' } });
  if (r.status === 401) throw "TMDB didn't accept the API key.";

const posterUrl = (x, size) => !x.poster ? '' : x.poster.startsWith('data:') ? x.poster : 'https://image.tmdb.org/t/p/' + (size || 'w342') + x.poster;
async function loadCatalog(sv, force) {
  const reg = regionCode(), ck = 'tmdb.' + sv.id + '.' + reg;
  const cached = store.get(ck, null);
  if (!force && cached && Date.now() - cached.t < 6 * 3600e3) return cached.items;
  if (!NATIVE) return mockCatalog(sv);
  const base = { with_watch_providers: sv.id, watch_region: reg, with_watch_monetization_types: 'flatrate|free|ads', sort_by: 'popularity.desc', include_adult: 'false', language: navigator.language || 'en-GB' };
  const jobs = [];
  ['movie', 'tv'].forEach(kind => [1, 2, 3].forEach(page => jobs.push(
    tmdbGet('/discover/' + kind, { ...base, page }).then(d => (d.results || []).map(x => ({
      kind, id: x.id, title: x.title || x.name || '', date: x.release_date || x.first_air_date || '', pop: x.popularity || 0,
      score: x.vote_average || 0, poster: x.poster_path || '', overview: x.overview || '',
    }))).catch(e => { if (/key/i.test(String(e))) throw e; return []; }))));
  const seen = new Set();
  const items = (await Promise.all(jobs)).flat().filter(x => { const k = x.kind + x.id; if (seen.has(k)) return false; seen.add(k); return true; })
    .sort((a, b) => b.pop - a.pop);
  store.set(ck, { t: Date.now(), items });
  return items;
}

function openAll(opts) {

  ov.innerHTML = `<div class="ovTitle">${svg('grid')}<span>${esc(opts.title || 'All Software')}</span></div>

    <div class="grid"></div>`;
  const grid = $('.grid', ov);
  let tab = opts.mode ? 'all' : (APPS.some(isGameish) ? 'games' : 'all');
  let list = [], cells = [], sel = 0;

  function build() {
    const onHome = new Set(homeList());
    list = tab === 'games' ? APPS.filter(isGameish) : APPS.slice();
    grid.innerHTML = '';
    cells = list.map((a, i) => {
      const c = el('div', 'cell'), art = el('div', 'art g');
      c.style.setProperty('--i', i);
      artBox(a.pkg, 256, art);
      if (onHome.has(a.pkg)) art.appendChild(el('span', 'pin', svg('home')));
      c.appendChild(art); c.appendChild(el('div', 'nm', esc(a.label)));
      onPress(c, () => {
        const was = sel === i && c.classList.contains('sel');
        sel = i; paint();
        if (cfg.oneTap || was) act(); else { Snd.tick(); buzz(); }
      }, () => { sel = i; paint(); if (!opts.mode) appOptions(a.pkg); });
      grid.appendChild(c); return c;
    });

      ? 'No games found yet.<br>Switch to <b>All Apps</b> (R) and add any app to Home.'
      : 'No apps found.'));
    $$('.t', ov).forEach(t => t.classList.toggle('on', t.dataset.t === tab));
    sel = clamp(sel, 0, Math.max(0, cells.length - 1));
    paint(true);
  }
  function paint(noScroll) {
    cells.forEach((c, i) => { c.classList.toggle('sel', i === sel); c.firstChild.classList.toggle('sel', i === sel); });
    if (!noScroll) ensure();
  }
  function cols() {
    if (cells.length < 2) return 1;
    const t0 = cells[0].offsetTop; let n = 0;
    for (const c of cells) { if (c.offsetTop !== t0) break; n++; }
    return Math.max(1, n);
  }
  function ensure() {
    const c = cells[sel]; if (!c) return;
    const g = grid.getBoundingClientRect(), r = c.getBoundingClientRect(), pad = g.height * 0.06;
    if (r.top < g.top + pad) grid.scrollBy({ top: r.top - g.top - pad, behavior: 'smooth' });
    else if (r.bottom > g.bottom - pad) grid.scrollBy({ top: r.bottom - g.bottom + pad, behavior: 'smooth' });
  }
  function move(d) {
    let n = sel + d;
    if (d > 1 && n >= cells.length) {
      const c = cols();
      n = Math.floor(sel / c) < Math.floor((cells.length - 1) / c) ? cells.length - 1 : -1;
    }
    if (n < 0 || n >= cells.length || !cells.length) { Snd.bump(); return; }
    sel = n; Snd.tick(); buzz(); paint();
  }
  function act() {
    const a = list[sel]; if (!a) return;
    if (opts.mode === 'pick') { Snd.select(); popOverlay(true); opts.onPick(a.pkg); }
    else if (opts.mode === 'add') { Snd.select(); popOverlay(true); setOnHome(a.pkg, true); toast('Added ' + a.label + ' to Home'); }
    else launch(a.pkg, cells[sel].firstChild);

  function switchTab(t) {
    if (t === tab) { Snd.bump(); return; }
    grid.classList.remove('fromL', 'fromR'); grid.classList.add(t === 'all' ? 'fromR' : 'fromL');
    tab = t; sel = 0; Snd.tick(); build(); grid.scrollTop = 0;
  }
  $$('.t', ov).forEach(t => onPress(t, () => switchTab(t.dataset.t)));

  pushOverlay({
    el: ov, full: true,
    pad(b) {
      switch (b) {
        case 'left': move(-1); break;
        case 'right': move(1); break;
        case 'up': move(-cols()); break;
        case 'down': move(cols()); break;
        case 'a': act(); break;
        case 'plus': case 'x': if (!opts.mode && list[sel]) { Snd.select(); appOptions(list[sel].pkg); } else Snd.bump(); break;
        case 'l': switchTab('games'); break;
        case 'r': switchTab('all'); break;
        case 'b': popOverlay(); break;
      }
    },
    hints: () => opts.mode ? [['b', 'Back'], ['a', opts.mode === 'pick' ? 'Choose' : 'Add']] : [['b', 'Back'], ['plus', 'Options'], ['a', 'Start']],
    refresh: build,
  });
  build();
}

function openSettings(startCat) {
  const ov = el('section', 'ov full');
  ov.innerHTML = `<div class="ovTitle">${svg('gear')}<span>Launcher Settings</span></div><div class="ovRule"></div><div class="ovRule bottom"></div>
    <nav class="setNav"></nav><div class="setPane"></div>`;
  const nav = $('.setNav', ov), pane = $('.setPane', ov);
  let cat = startCat || 0, focus = 'nav', row = 0, rows = [], rowEls = [];
  let tIdx = Math.max(0, THEMES.findIndex(t => t[0] === cfg.theme));

  const navBar = el('i', 'navBar'); nav.appendChild(navBar);
  const navEls = SETTINGS.map((s, i) => {
    const e = el('div', 'navItem g', esc(s.name));
    e.style.setProperty('--i', i);
    onPress(e, () => { if (cat !== i) { cat = i; row = 0; renderPane(); } focus = 'nav'; Snd.tick(); paint(); });
    nav.appendChild(e); return e;
  });

  function renderPane() {
    rows = SETTINGS[cat].rows().filter(Boolean);
    row = clamp(row, 0, rows.length - 1);
    pane.innerHTML = '';
    rowEls = rows.map((r, i) => { const e = rowEl(r, i); pane.appendChild(e); return e; });
  }
  function rowEl(r, i) {
    const e = el('div', 'setRow g ' + r.type);
    e.style.setProperty('--i', i);
    if (r.type === 'themes') {
      e.innerHTML = `<span class="lbl">${esc(r.label)}</span><div class="tcards"></div>`;
      const box = $('.tcards', e);
      THEMES.forEach(([id, name], k) => {
        const c = el('div', 'tcard' + (cfg.theme === id ? ' cur' : ''),
          `<div class="tprev ${id} g"><div class="in"><i></i><i></i><i></i><i></i><b></b></div><span class="check">${svg('check')}</span></div>${esc(name)}`);
        onPress(c, () => { row = i; focus = 'pane'; tIdx = k; paint(); setTheme(id); });
        box.appendChild(c);
      });
      return e;
    }
    e.innerHTML = `<span class="lbl">${esc(r.label)}${r.desc ? `<span class="desc">${esc(r.desc)}</span>` : ''}</span><span class="val"></span>`;
    fillVal(r, $('.val', e));
    onPress(e, ev => {
      row = i; focus = 'pane'; paint();
      if (r.type === 'slider') {
        const bar = $('.bar', e), br = bar.getBoundingClientRect();
        if (ev.clientX >= br.left - 10 && ev.clientX <= br.right + 10) {
          const f = clamp((ev.clientX - br.left) / br.width, 0, 1);
          r.set(Math.round((r.min + f * (r.max - r.min)) / r.step) * r.step); Snd.tick(); fillVal(r, $('.val', e)); return;
        }
        adjust(r, 1); return;
      }
      activate(r);
    });
    return e;
  }
  function fillVal(r, v) {
    if (r.type === 'toggle') v.innerHTML = `<span class="sw${cfg[r.key] ? ' on' : ''}"><i></i></span>`;
    else if (r.type === 'choice') { const o = r.options.find(x => x[0] === cfg[r.key]) || r.options[0]; v.innerHTML = `<span class="arr">‹</span>${esc(o[1])}<span class="arr">›</span>`; }
    else if (r.type === 'slider') { const val = r.get(), p = (val - r.min) / (r.max - r.min) * 100; v.innerHTML = `<span class="bar"><i style="width:${p}%"></i></span><span class="num">${esc(r.fmt(val))}</span>`; }
    else if (r.type === 'action') v.innerHTML = `${esc(r.value ? r.value() : '')}<span class="chev">›</span>`;
    else if (r.type === 'info') v.textContent = r.value();
  }
  function refreshRow(i) { const r = rows[i], e = rowEls[i]; if (r && e && r.type !== 'themes') fillVal(r, $('.val', e)); }
  function activate(r) {
    pressFx(rowEls[row]);
    if (r.type === 'toggle') { cfg[r.key] = !cfg[r.key]; saveCfg(); r.after && r.after(); Snd.select(); buzz(); refreshRow(row); }
    else if (r.type === 'choice') adjust(r, 1);
    else if (r.type === 'action') { Snd.select(); r.run(); }
    else if (r.type === 'slider') adjust(r, 1);
    else if (r.type === 'themes') setTheme(THEMES[tIdx][0]);
  }
  function adjust(r, d) {
    if (r.type === 'choice') {
      const k = r.options.findIndex(x => x[0] === cfg[r.key]);
      cfg[r.key] = r.options[(k + d + r.options.length) % r.options.length][0];
      saveCfg(); r.after && r.after(); Snd.tick(); buzz(); refreshRow(row); return true;
    }
    if (r.type === 'slider') {
      const v = clamp(Math.round((r.get() + d * r.step) / r.step) * r.step, r.min, r.max);
      if (Math.abs(v - r.get()) < 1e-9) { Snd.bump(); return true; }
      r.set(+v.toFixed(3)); Snd.tick(); refreshRow(row); return true;
    }
    if (r.type === 'toggle') {
      const want = d > 0; if (cfg[r.key] === want) { Snd.bump(); return true; }
      cfg[r.key] = want; saveCfg(); r.after && r.after(); Snd.tick(); refreshRow(row); return true;
    }
    if (r.type === 'themes') {
      const n = tIdx + d;
      if (n < 0) return false;
      if (n >= THEMES.length) { Snd.bump(); return true; }
      tIdx = n; Snd.tick(); buzz(); paint(); return true;
    }
    return false;
  }
  function paint() {
    navEls.forEach((e, i) => { e.classList.toggle('cur', i === cat); e.classList.toggle('sel', focus === 'nav' && i === cat); });
    const ce = navEls[cat]; if (ce) { navBar.style.top = (ce.offsetTop + ce.offsetHeight * .2) + 'px'; navBar.style.height = (ce.offsetHeight * .6) + 'px'; }
    rowEls.forEach((e, i) => e.classList.toggle('sel', focus === 'pane' && i === row && rows[i].type !== 'themes'));
    rowEls.forEach((e, i) => {
      if (rows[i].type !== 'themes') return;
      $$('.tcard', e).forEach((c, k) => {
        c.classList.toggle('cur', THEMES[k][0] === cfg.theme);
        $('.tprev', c).classList.toggle('sel', focus === 'pane' && i === row && k === tIdx);
      });
    });
    const e = rowEls[row];
    if (focus === 'pane' && e) e.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
  renderPane();
  pushOverlay({
    el: ov, full: true,
    pad(b) {
      if (focus === 'nav') {
        if (b === 'up' || b === 'down') {
          const n = cat + (b === 'up' ? -1 : 1);
          if (n < 0 || n >= SETTINGS.length) { Snd.bump(); return; }
          cat = n; row = 0; Snd.tick(); buzz(); renderPane(); paint();
        } else if (b === 'right' || b === 'a') { focus = 'pane'; row = 0; tIdx = Math.max(0, THEMES.findIndex(t => t[0] === cfg.theme)); Snd.tick(); paint(); }
        else if (b === 'b') popOverlay();
      } else {
        const r = rows[row];
        if (b === 'up' || b === 'down') {
          const n = row + (b === 'up' ? -1 : 1);
          if (n < 0 || n >= rows.length) { Snd.bump(); return; }
          row = n; Snd.tick(); buzz(); paint();
        } else if (b === 'left') { if (!adjust(r, -1)) { focus = 'nav'; Snd.tick(); paint(); } }
        else if (b === 'right') { if (!adjust(r, 1)) Snd.bump(); }
        else if (b === 'a') activate(r);
        else if (b === 'b') { focus = 'nav'; Snd.back(); paint(); }
      }
    },
    hints: () => [['b', 'Back'], ['a', 'OK']],
    refresh() { renderPane(); paint(); },
  });
  paint();
}

  let txt;
  if (use24) { txt = h + ':' + m; $('#ampm').textContent = ''; }
  else { $('#ampm').textContent = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; txt = h + ':' + m; }
  const hm = $('#hm');

    const first = hm.textContent === '--:--', [a, b] = txt.split(':');
    hm.innerHTML = esc(a) + '<span class="col">:</span>' + esc(b);

}

  const [title, c1, c2, kind] = a.art;
  let s = '';
  if (kind === 'race') s = [0, 1, 2, 3, 4].map(i => `<rect x="${-40 + i * 50}" y="40" width="18" height="160" fill="#fff" opacity=".18" transform="skewX(-25)"/>`).join('') + '<circle cx="100" cy="92" r="34" fill="none" stroke="#fff" stroke-width="10"/><circle cx="100" cy="92" r="9" fill="#fff"/>';
  if (kind === 'island') s = '<circle cx="150" cy="45" r="20" fill="#fff6c2"/><ellipse cx="100" cy="125" rx="70" ry="22" fill="#2e7d32"/><path d="M60 125 Q100 40 140 125z" fill="#43a047"/><ellipse cx="100" cy="150" rx="80" ry="10" fill="#fff" opacity=".25"/>';
  if (kind === 'bolt') s = '<path d="M112 20 60 110h36l-16 70 62-100h-38z" fill="#fff" opacity=".92"/>';
  if (kind === 'pixel') s = [[60,60],[80,60],[100,60],[120,60],[60,80],[140,80],[60,100],[80,100],[100,100],[120,100],[140,100],[80,120],[120,120]].map(([x, y]) => `<rect x="${x}" y="${y}" width="20" height="20" fill="#5a2d0c" opacity=".85"/>`).join('');
  if (kind === 'stars') s = Array.from({ length: 26 }, (_, i) => `<circle cx="${(i * 73) % 200}" cy="${(i * 41) % 140}" r="${1 + (i % 3)}" fill="#fff" opacity=".85"/>`).join('') + '<path d="M70 140 l30-70 30 70 -30-15z" fill="#ffd166"/>';
  if (kind === 'sun') s = '<circle cx="100" cy="70" r="30" fill="#fff59d"/><path d="M0 130 Q50 100 100 125 T200 120 V200 H0z" fill="#33691e"/>';
  if (kind === 'bubbles') s = '<circle cx="60" cy="70" r="26" fill="#fff" opacity=".55"/><circle cx="125" cy="60" r="34" fill="#fff" opacity=".4"/><circle cx="105" cy="115" r="22" fill="#fff" opacity=".6"/>';
  if (kind === 'waves') s = '<path d="M0 90 Q25 75 50 90 T100 90 T150 90 T200 90 V200 H0z" fill="#fff" opacity=".2"/><path d="M0 115 Q25 100 50 115 T100 115 T150 115 T200 115 V200 H0z" fill="#fff" opacity=".22"/><circle cx="140" cy="55" r="8" fill="none" stroke="#fff" stroke-width="3"/>';
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs><rect width="200" height="200" fill="url(#g)"/>${s}<text x="100" y="182" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="21" fill="#fff" stroke="rgba(0,0,0,.25)" stroke-width="1">${title.toUpperCase()}</text></svg>`);
}

/* =========================================================
   Boot
   ========================================================= */
function boot() {
  $('#padInd .padIcon').innerHTML = svg('pad');
  onPress($('#avatar'), () => { Snd.select(); retrigger($('#avatar'), 'wiggle'); setTimeout(avatarMenu, 220); });
  loadApps();
  renderDock();
  renderRow();
  applyTheme();
  nb('setSwapAB', cfg.swapAB); nb('setImmersive', cfg.immersive); nb('setOrientation', cfg.orientation);
  setAvatar();
  updateStatus();
  setInterval(updateClock, 1000);
  setInterval(updateStatus, 15000);
  let lastSL = 0, tilt = 0, tiltRaf = 0;
  const tiltLoop = () => {
    tilt *= 0.86; const row = $('#row');
    if (Math.abs(tilt) > 0.05 && !cfg.calm) { row.style.transform = `skewX(${(-tilt).toFixed(2)}deg)`; tiltRaf = requestAnimationFrame(tiltLoop); }
    else { row.style.transform = ''; tiltRaf = 0; }
  };
  $('#rowWrap').addEventListener('scroll', () => {
    const w = $('#rowWrap'), d = w.scrollLeft - lastSL; lastSL = w.scrollLeft;
    tilt = clamp(tilt + d * 0.035, -3.5, 3.5); if (!tiltRaf) tiltRaf = requestAnimationFrame(tiltLoop);
    requestAnimationFrame(positionTitle);
  }, { passive: true });
  window.addEventListener('resize', () => { refreshSel(); ensureRowVisible(false); fitTitle(); });
  if (document.fonts) document.fonts.ready.then(() => { refreshSel(); fitTitle(); });
  document.body.classList.add('intro');
  requestAnimationFrame(() => { document.body.classList.add('ready'); refreshSel(); });
  setTimeout(() => document.body.classList.remove('intro'), 1400);
  Music.start();

  if (NATIVE && !store.get('askedHome') && !nb('isDefaultHome')) {
    setTimeout(() => openDialog('Make this your Home screen?',
      'Pick NSXL as your Home app so the Home button always brings you here.',
      [{ label: 'Not now', cancel: true, run: () => store.set('askedHome', true) },
       { label: 'Set as Home', primary: true, run: () => { store.set('askedHome', true); nb('openSettings', 'home'); } }]), 900);
  }
}
boot();
})();
</script>
