<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NSXL second screen</title>
<style>
@font-face { font-family: "Montserrat"; src: url("fonts/Montserrat.ttf") format("truetype"); font-weight: 100 900; }
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; color: #fff;
  font-family: Montserrat, system-ui, sans-serif; -webkit-font-smoothing: antialiased; user-select: none; }
#stage { position: absolute; inset: 0; }
.layer { position: absolute; inset: 0; opacity: 0; transition: opacity .9s ease; }
.layer.on { opacity: 1; }
.media { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
img.media { animation: drift 34s ease-in-out infinite alternate; }
@keyframes drift { from { transform: scale(1.02); } to { transform: scale(1.09) translate(-1.2%, -1%); } }
.bg { position: absolute; inset: -8%; width: 116%; height: 116%; object-fit: cover; filter: blur(52px) saturate(1.35) brightness(.5); }
.shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 52%, rgba(0,0,0,.62) 100%), linear-gradient(90deg, rgba(0,0,0,.35), rgba(0,0,0,0) 45%); }
.logo { position: absolute; left: 5vw; bottom: 7vh; max-width: 36vw; max-height: 24vh; object-fit: contain; object-position: left bottom;
  filter: drop-shadow(0 .6vh 2.6vh rgba(0,0,0,.6)); animation: rise 1.1s cubic-bezier(.2,.8,.2,1) .2s both; }
.title { position: absolute; left: 5vw; right: 5vw; bottom: 7vh; font-size: 6vh; font-weight: 800; line-height: 1.08; letter-spacing: -.01em;
  text-shadow: 0 .5vh 2.4vh rgba(0,0,0,.55); animation: rise 1.1s cubic-bezier(.2,.8,.2,1) .2s both; }
.card { position: absolute; left: 8vw; right: 8vw; top: 50%; transform: translateY(-50%); display: flex; align-items: center; gap: 4.5vw; }
.tile { flex: none; width: min(40vh, 34vw); aspect-ratio: 1; border-radius: 2.4vh; overflow: hidden; background: #151515;
  box-shadow: 0 3vh 9vh rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.08); animation: rise 1s cubic-bezier(.2,.8,.2,1) both; }
.tile > * { width: 100%; height: 100%; object-fit: cover; display: block; }
.card .title { position: static; animation-delay: .15s; }
.now { position: absolute; left: 5vw; top: 6vh; display: flex; align-items: center; gap: 1.2vh; padding: 1.1vh 2.2vh 1.1vh 1.6vh; border-radius: 99vh;
  background: rgba(0,0,0,.45); backdrop-filter: blur(16px); font-size: 2.1vh; font-weight: 700; letter-spacing: .04em; animation: rise .9s cubic-bezier(.2,.8,.2,1) .3s both; }
.now i { width: 1.2vh; height: 1.2vh; border-radius: 50%; background: #3ddc84; box-shadow: 0 0 0 .5vh rgba(61,220,132,.25); animation: pulse 2s ease-in-out infinite; }
.now span { color: rgba(255,255,255,.7); font-weight: 600; font-variant-numeric: tabular-nums; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }
@keyframes rise { from { opacity: 0; transform: translateY(2.4vh); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { img.media, .logo, .title, .tile { animation: none !important; } .layer { transition-duration: .2s; } }
</style>
</head>
<body>
<div id="stage" aria-live="polite"></div>
<script>
(() => {
  const stage = document.getElementById('stage');
  let cur = null, last = '';
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  function media(m, cls) {
    if (m.video) {
      const v = el('video', cls); v.muted = true; v.loop = true; v.autoplay = true; v.playsInline = true; v.src = m.url;
      v.play().catch(() => {}); return v;
    }
    const i = el('img', cls); i.alt = ''; i.decoding = 'async'; i.src = m.url; return i;
  }
  // No banner for this game: its tile, big, over a blurred copy of itself.
  function fallback(layer, d) {
    layer.textContent = '';
    layer.append(media(d.tile, 'bg'), el('div', 'shade'));
    const card = el('div', 'card'), tile = el('div', 'tile');
    tile.append(media(d.tile, ''));
    card.append(tile, el('div', 'title', d.label));
    layer.append(card);
  }
  window.show = d => {
    const k = JSON.stringify(d);
    if (k === last) return;
    last = k;
    const layer = el('div', 'layer');
    if (d.media) {
      const m = media(d.media, 'media');
      m.addEventListener('error', () => fallback(layer, d), { once: true });
      layer.append(m, el('div', 'shade'));
      if (d.logo) {
        const logo = el('img', 'logo'); logo.alt = d.label; logo.src = d.logo;
        logo.addEventListener('error', () => logo.replaceWith(el('div', 'title', d.label)), { once: true });
        layer.append(logo);
      } else layer.append(el('div', 'title', d.label));
    } else fallback(layer, d);
    if (d.playing) {   // the game you're playing: a live "Now playing" badge with how long
      const chip = el('div', 'now'), t = el('span');
      chip.append(el('i'), document.createTextNode('NOW PLAYING'), t);
      const tick = () => { const m = Math.max(0, Math.floor((Date.now() - d.playing.since) / 60000)); t.textContent = m < 60 ? m + ' min' : Math.floor(m / 60) + ' h ' + (m % 60) + ' min'; };
      tick(); layer._t = setInterval(tick, 30000);
      layer.append(chip);
    }
    stage.append(layer);
    requestAnimationFrame(() => requestAnimationFrame(() => layer.classList.add('on')));
    const old = cur; cur = layer;
    if (old) { old.classList.remove('on'); clearInterval(old._t); setTimeout(() => old.remove(), 1000); }
  };
})();
</script>
</body>
</html>
